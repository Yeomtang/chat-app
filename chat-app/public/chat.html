<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>익명 채팅</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* 폼 요소는 브라우저 기본 글꼴을 써서 본문 글꼴을 물려받지 않음 → 본문과 같은 글꼴로 */
    button, input, textarea, select { font-family: inherit; }

    /* ── 디자인 토큰 (블러시 팔레트) ── LED 화면(led.html)과 동일한 값 유지 */
    :root {
      --bg:          #efdcd5; /* 화면 배경 (블러시) */
      --bg-soft:     #f8ece7; /* 입력창 등 보조 표면 */
      --surface:     #ffffff; /* 카드 · 말풍선 */
      --ink:         #1e1e42; /* 본문 텍스트 · 네이비 */
      --ink-soft:    #6e6a86; /* 보조 텍스트 */
      --ink-faint:   #a49eb4; /* 흐린 텍스트 · 플레이스홀더 */
      --orange:      #fb7e55; /* 1번 보기 · 강조 */
      --orange-tint: #ffe6db;
      --orange-deep: #b5502e;
      --purple:      #5b5cc4; /* 2번 보기 */
      --purple-tint: #e3e3f7;
      --warn:        #d94f3d;
      --line:        rgba(30, 30, 66, 0.10);
      --shadow:      0 8px 24px rgba(30, 30, 66, 0.08);
      --shadow-lg:   0 18px 50px rgba(30, 30, 66, 0.16);
    }

    body {
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
      background: var(--bg);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── 입장 화면 ── */
    #entrance {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      padding: 32px 24px;
      background: var(--bg);
    }

    #entrance h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 6px;
      text-align: center;
    }

    #entrance p {
      font-size: 14px;
      color: var(--ink-soft);
      margin-bottom: 40px;
      text-align: center;
      line-height: 1.5;
    }

    .nickname-card {
      width: 100%;
      background: var(--surface);
      box-shadow: var(--shadow);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .nickname-label {
      font-size: 12px;
      color: var(--ink-soft);
      margin-bottom: 8px;
      letter-spacing: 0.3px;
      width: 100%;
      text-align: center;
    }

    #nickname-display {
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.3;
      width: 100%;
      text-align: center;
      word-break: keep-all;        /* 좁은 폰에서 '관/객'처럼 낱말 중간이 끊기지 않게 */
      overflow-wrap: break-word;
    }

    .btn-reroll {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: none;
      border: 1.5px solid rgba(30, 30, 66, 0.18);
      border-radius: 100px;
      padding: 10px 20px;
      font-size: 14px;
      color: var(--ink-soft);
      cursor: pointer;
      margin: 0 auto 32px;
      font-family: inherit;
      transition: background 0.15s;
    }

    .btn-reroll:active { background: var(--bg-soft); }

    .btn-enter {
      width: 100%;
      background: var(--ink);
      color: var(--surface);
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
    }

    .btn-enter:active { opacity: 0.8; }

    /* ── 채팅 화면 ── */
    #chatroom {
      display: none;
      flex-direction: column;
      height: 100dvh;
      position: relative;
    }

    #chat-content {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      transition: filter 0.5s ease, opacity 0.5s ease;
    }

    #chat-content.blurred {
      filter: blur(16px);
      opacity: 0.5;
      pointer-events: none;
    }

    /* ── 투표 오버레이 (관객 폰) ── */
    /* 보기가 많거나 질문이 길어 카드가 화면보다 커지면 스크롤로 볼 수 있어야 한다.
       align-items:center + overflow 조합은 위쪽이 잘려 접근 불가라서, 카드에 margin:auto를 쓴다. */
    #voting-overlay {
      display: none;
      position: absolute;
      inset: 0;
      justify-content: center;
      padding: 28px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      z-index: 30;
    }

    #voting-overlay.active { display: flex; }

    /* 등장 모션: 작은 박스가 중앙에서 살짝 튕기듯 커지며 등장 */
    #voting-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
      max-width: 320px;
      margin: auto; /* 공간이 남으면 가운데, 넘치면 위부터 (잘림 방지) */
      position: relative;
      background: var(--surface);
      border-radius: 24px;
      padding: 44px 24px 28px;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      transform: scale(0.4);
    }

    #voting-overlay.active #voting-card {
      animation: voteCardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes voteCardIn {
      0%   { opacity: 0; transform: scale(0.4); }
      60%  { opacity: 1; transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* 타이머 배지: 카드 상단 중앙에 걸치는 형태 (LED 질문 카드와 동일) */
    #voting-timer-phone {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(-50%, -50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--surface);
      font-size: 18px;
      font-weight: 700;
      transition: background 0.4s, color 0.4s;
    }

    /* 타이머 마지막 5초: 경고색 + 은은한 맥박(LED 화면과 동일 패턴) */
    #voting-timer-phone.hot {
      background: var(--warn);
      color: var(--surface);
      animation: timerPulse 1s ease-in-out infinite;
    }
    @keyframes timerPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50%      { transform: translate(-50%, -50%) scale(1.12); }
    }
    @media (prefers-reduced-motion: reduce) {
      #voting-timer-phone.hot { animation: none; } /* 색만 바뀌고 맥박은 생략 */
    }

    /* 투표 피드백: 버튼에서 위로 날아올라 사라지는 작은 공 (WAAPI로 움직이고 끝나면 제거) */
    .vote-fly {
      position: fixed;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 60;
    }

    /* ── 내 공 미니 원 (시안 1 "내 표 피드백") ── 보기마다 작은 공 덩어리, 내 표만 같은 색 빛 번짐(숨쉬기) + 가운데 흰 점.
       다른 공은 보기마다 같은 개수의 옅은 장식 공 — 투표 중 표 수·비율은 폰에 보내지 않으므로(서버는 집계를 화면에만 보냄) 드러나지 않는다 */
    .vote-mini {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .vote-mini.active { display: flex; }
    .vote-mini-canvas {
      display: block;
      width: 100%;
      height: 112px;
      border-radius: 14px;
      background: var(--bg-soft);
    }
    .vote-mini-hint {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
      text-align: center;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    /* 타이머 게이지: 남은 시간만큼 줄어드는 막대 — 숫자와 같은 마감 시각(서버 기준)으로 움직인다.
       채움은 transform(scaleX) 한 번의 linear 애니메이션(Web Animations)으로 처리해 폰 부담 없이 매끄럽게. 마지막 5초는 숫자 배지와 같이 경고색 */
    .timer-gauge {
      display: none;
      width: 100%;
      height: 6px;
      border-radius: 100px;
      background: var(--bg-soft);
      overflow: hidden;
      flex-shrink: 0;
    }
    .timer-gauge.active { display: block; }
    .timer-gauge-fill {
      width: 100%;
      height: 100%;
      background: var(--ink);
      transform-origin: left center;
      will-change: transform;
      transition: background-color 0.4s;
    }
    .timer-gauge.hot .timer-gauge-fill { background: var(--warn); }
    /* 마지막 5초: 숫자 배지 맥박(timerPulse, 1초)과 같은 박자로 막대 둘레가 경고색으로 은은하게 번짐 (LED 게이지와 같은 연출) */
    .timer-gauge.hot { animation: gaugePulse 1s ease-in-out infinite; }
    @keyframes gaugePulse {
      0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--warn) 0%, transparent); }
      50%      { box-shadow: 0 0 8px 1px color-mix(in srgb, var(--warn) 45%, transparent); }
    }
    @media (prefers-reduced-motion: reduce) {
      .timer-gauge.hot { animation: none; }
    }

    #voting-question-phone {
      font-size: 19px;
      font-weight: 700;
      color: var(--ink);
      text-align: center;
      line-height: 1.4;
      max-width: 320px;
      word-break: keep-all;      /* 한글 어절 단위 줄바꿈 */
      overflow-wrap: break-word; /* 한 어절이 너무 길면 예외적으로 자름 */
      text-wrap: balance;        /* 질문류: 줄 길이를 고르게 — "회사 / 행사는?"처럼 짧은 마지막 줄 방지 (미지원 브라우저는 그냥 줄바꿈) */
    }

    #voting-buttons {
      display: flex;
      gap: 14px;
      width: 100%;
      max-width: 320px;
    }

    /* 보기 버튼: 컬러 헤더 + 흰 본문 카드. 색은 JS가 옵션별 --strong으로 주입 (YES/NO·N지선다 공용) */
    .vote-btn {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
      border: none;
      border-radius: 16px;
      background: var(--surface);
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 14px rgba(30, 30, 66, 0.10);
      transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s;
    }

    .vote-btn-head {
      background: var(--strong, var(--ink));
      color: var(--surface);
      font-size: 18px;
      font-weight: 700;
      padding: 11px 8px;
      line-height: 1.25;
      word-break: keep-all;
      overflow-wrap: anywhere; /* 띄어쓰기 없는 긴 보기도 카드 폭 안에서 줄바꿈 */
      text-wrap: balance;      /* 마지막 줄에 한 글자만 남지 않게 줄 길이를 고르게 */
      /* 같은 줄 카드끼리 헤더 높이가 같아지도록 남는 높이는 헤더(보기 색)가 가져가고, 이름은 그 안에서 세로 가운데.
         본문(%) 높이는 고정 → 옆 보기 이름이 두 줄 이상이어도 이름 가운데·숫자 줄이 같은 높이에 옴 */
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    /* 띄어쓰기 없는 긴 덩어리(12자+)만: 글자마다 줄바꿈 기회를 줘야 balance가 줄 길이를 고르게 나눔
       (keep-all이면 마지막 줄에 '로' 한 글자). 같은 보기의 다른 어절은 keep-all 그대로 */
    .vote-btn-head .long-word { word-break: break-all; }

    .vote-btn-body {
      background: var(--bg-soft); /* 흰 카드 위에서도 본문이 상자처럼 읽히도록 살짝 톤 다운 */
      flex: none; /* 높이 고정 — 카드가 늘어난 만큼은 헤더가 채움(흰 띠 없음, 숫자 줄 정렬) */
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      color: var(--strong, var(--ink));
    }

    .vote-btn:active { transform: scale(0.96); }
    .vote-btn:disabled { cursor: default; } /* 결과 모드에서 비율(%)이 흐려지지 않도록 dim 없음 */
    .vote-btn.selected { box-shadow: 0 0 0 3px var(--strong, var(--ink)), 0 6px 18px rgba(30, 30, 66, 0.16); }

    /* 3지 이상(N지선다)은 2열 그리드로 줄바꿈 */
    #voting-buttons.grid { flex-wrap: wrap; }
    #voting-buttons.grid .vote-btn { flex: 1 1 calc(50% - 7px); }
    #voting-buttons.grid .vote-btn-head { font-size: 15px; }
    #voting-buttons.grid .vote-btn-body { min-height: 46px; font-size: 18px; }

    #voting-ratio {
      width: 100%;
      max-width: 320px;
    }

    .ratio-bar {
      width: 100%;
      height: 10px;
      border-radius: 6px;
      background: rgba(30, 30, 66, 0.08);
      display: flex;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .ratio-fill { height: 100%; transition: width 0.3s ease; }

    .ratio-text {
      display: flex;
      flex-wrap: wrap;
      justify-content: center; /* 카드 안 다른 요소(질문·보기·안내문)와 같은 가운데 정렬 */
      gap: 6px 14px;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-soft);
    }
    .ratio-item { display: inline-flex; align-items: center; gap: 5px; min-width: 0; word-break: keep-all; overflow-wrap: anywhere; } /* 어절 중간에서 줄이 바뀌지 않게 */
    .ratio-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

    /* 이모지 반응 버튼 */
    #emoji-buttons {
      display: none;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }
    #emoji-buttons.active { display: flex; }
    .emoji-btn {
      flex: 1 1 calc(50% - 6px);
      min-width: 0;
      min-height: 104px;
      padding: 14px 10px;
      border-radius: 18px;
      border: none;
      background: var(--bg-soft);
      cursor: pointer;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.12s, background 0.12s;
    }
    .emoji-btn-icon { font-size: 36px; line-height: 1; }
    .emoji-btn-label {
      max-width: 100%;          /* 세로 flex 가운데 정렬 자식이라 폭 제한이 없으면 버튼 밖으로 넘침 */
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      text-align: center;
      line-height: 1.3;
      word-break: keep-all;
      overflow-wrap: anywhere;  /* 띄어쓰기 없는 긴 라벨도 버튼 안에서 줄바꿈 (break-word는 최소 폭을 줄이지 못함) */
    }
    .emoji-btn:active { transform: scale(0.92); background: var(--orange-tint); }
    .emoji-btn.pop { animation: emojiPop 0.3s ease; }
    @keyframes emojiPop { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }

    /* ── 주관식 답변 입력 ── */
    #subjective-wrap {
      display: none;
      width: 100%;
      max-width: 320px;
    }

    #subjective-wrap.active { display: block; }

    #subjective-form {
      display: flex;
      gap: 8px;
    }

    #answer-input {
      flex: 1;
      min-width: 0; /* input 기본 최소 너비 해제 — 좁은 화면에서 버튼이 카드 밖으로 밀리는 문제 방지 */
      background: var(--bg-soft);
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      font-family: inherit;
      color: var(--ink);
      outline: none;
    }

    #answer-input::placeholder { color: var(--ink-faint); }

    #answer-submit {
      background: var(--ink);
      color: var(--surface);
      border: none;
      border-radius: 14px;
      padding: 0 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      flex-shrink: 0;
    }

    #answer-submit:disabled { opacity: 0.4; cursor: default; }

    #answer-done {
      display: none;
      background: var(--orange-tint);
      color: var(--orange-deep);
      border-radius: 14px;
      padding: 16px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      line-height: 1.4;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    #subjective-wrap.answered #subjective-form { display: none; }
    #subjective-wrap.answered #answer-done { display: block; }

    /* ── 결과 모드 붐업/붐따 ── */
    #result-react {
      display: none;
      width: 100%;
      max-width: 320px;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    #result-react.active { display: flex; }

    #result-react-hint {
      font-size: 13px;
      color: var(--ink-soft);
      text-align: center;
    }

    #result-react-buttons {
      display: flex;
      gap: 12px;
    }

    .result-react-btn {
      flex: 1;
      padding: 14px 0;
      border-radius: 16px;
      border: none;
      background: var(--bg-soft);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.15s;
    }

    .result-react-btn:active { transform: scale(0.95); }
    .result-react-btn.pop { animation: reactPop 0.3s ease; }

    #chat-header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    #chat-header .avatar {
      width: 32px;
      height: 32px;
      background: var(--ink);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--surface);
      font-weight: 700;
      flex-shrink: 0;
    }

    #chat-header .header-info {
      flex: 1;
      min-width: 0; /* 긴 닉네임이 헤더를 밀어내지 않게 */
    }

    #chat-header .header-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
    }

    #chat-header .header-sub {
      font-size: 12px;
      color: var(--ink-soft);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .msg-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 8px;
    }

    .msg-bubble {
      display: inline-flex;
      flex-direction: column;
      background: var(--surface);
      color: var(--ink);
      align-self: flex-start; /* 글 길이에 맞춘 말풍선 (넓은 화면에서 가로로 늘어나지 않게) */
      padding: 8px 16px 10px;
      border-radius: 18px;
      box-shadow: 0 3px 12px rgba(30, 30, 66, 0.07);
      font-size: 15px;
      line-height: 1.4;
      max-width: 80%;
      word-break: keep-all;
      overflow-wrap: break-word;
      transition: background 0.6s ease, color 0.6s ease, box-shadow 0.6s ease;
    }

    /* 운영자 메시지 — 네이비 배경으로 구분 */
    .msg-bubble.operator { background: var(--ink); }
    .msg-bubble.operator .msg-nickname { color: rgba(255, 255, 255, 0.7); }
    .msg-bubble.operator .msg-text { color: var(--surface); }

    /* 내 채팅이 LED에 고정됨 — 말풍선이 잠시 주황으로 물들며 은은하게 빛남 */
    .msg-bubble.pinned { background: var(--orange); color: var(--surface); box-shadow: 0 0 0 6px rgba(251, 126, 85, 0.25), 0 6px 18px rgba(30, 30, 66, 0.12); }
    .msg-bubble.pinned .msg-nickname { color: rgba(255, 255, 255, 0.85); }
    .msg-bubble.pinned .msg-text { color: var(--surface); }

    .msg-nickname {
      font-size: 12px;
      font-weight: 700;
      color: var(--orange-deep); /* 닉네임 강조 — LED 화면과 같은 색 */
      margin-bottom: 2px;
    }

    .msg-text {
      color: var(--ink);
      text-wrap: pretty; /* 채팅: 마지막 줄에 한 글자만 남지 않게 (keep-all은 말풍선에서 상속, 미지원 브라우저는 그냥 줄바꿈) */
    }

    /* ── 입력창 ── */
    #input-area {
      background: var(--surface);
      border-top: 1px solid var(--line);
      padding: 8px 12px;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    #msg-input {
      flex: 1;
      min-width: 0; /* 좁은 화면에서 리액션/전송 버튼 밀림 방지 */
      background: var(--bg-soft);
      border: none;
      border-radius: 20px;
      padding: 9px 14px;
      font-size: 15px;
      font-family: inherit;
      color: var(--ink);
      outline: none;
      resize: none;
      max-height: 100px;
      line-height: 1.4;
    }

    #msg-input::placeholder { color: var(--ink-faint); }

    /* 리액션 버튼 (하트/붐업) */
    .react-btn {
      width: 34px;
      height: 34px;
      background: var(--bg-soft);
      border: none;
      border-radius: 50%;
      font-size: 17px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
    }

    .react-btn.pop { animation: reactPop 0.3s ease; }

    @keyframes reactPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.35); }
      100% { transform: scale(1); }
    }

    /* 글자 수 카운터: 80자 이상일 때만 표시 */
    #char-counter {
      display: none;
      font-size: 11px;
      color: var(--ink-soft);
      flex-shrink: 0;
      align-self: center;
    }

    #char-counter.visible { display: block; }
    #char-counter.limit { color: var(--warn); font-weight: 700; }

    /* ── 안내 띠 (연결 상태·전송 안내) ── 입력창 바로 위. 연결 끊김은 계속, 전송 안내는 잠깐 표시 */
    /* 위로 올려 읽는 중에 새 채팅이 오면 목록 아래쪽에 뜨는 알림 (누르면 맨 아래로) — 위치(bottom)는 JS가 입력창 위로 */
    .new-msg-pill {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      width: fit-content;
      margin: 0 auto;
      padding: 7px 14px;
      border: none;
      border-radius: 16px;
      background: var(--ink);
      color: var(--surface);
      font-size: 13px;
      font-weight: 700;
      box-shadow: var(--shadow);
      cursor: pointer;
      z-index: 5;
    }
    .new-msg-pill.visible {
      display: block;
      animation: voteCardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; /* 공용 popIn 패턴 */
    }

    .notice-bar {
      display: none;
      margin: 0 12px 8px;
      padding: 8px 14px;
      border-radius: 14px;
      background: var(--ink);
      color: var(--surface);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      text-align: center;
      word-break: keep-all;
      overflow-wrap: break-word;
      flex-shrink: 0;
    }
    .notice-bar.visible {
      display: block;
      animation: voteCardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; /* 공용 popIn 패턴 */
    }
    .notice-bar.warn { background: var(--warn); }

    /* ── 운영진 공지 핀 ── 관리자가 운영진 채팅을 핀하면 채팅 맨 위에 고정 (운영진 화면 host.html과 같은 모양) */
    .pin-notice {
      display: none;
      align-items: flex-start;
      gap: 10px;
      margin: 8px 12px 0;
      padding: 10px 14px;
      border-radius: 14px;
      background: var(--ink);
      color: var(--surface);
      box-shadow: var(--shadow);
      flex-shrink: 0;
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    .pin-notice.visible {
      display: flex;
      animation: voteCardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; /* 공용 popIn 패턴 */
    }
    .pin-notice-icon { font-size: 16px; line-height: 1.4; flex-shrink: 0; }
    .pin-notice-body { flex: 1; min-width: 0; }
    .pin-notice-nick { font-size: 12px; font-weight: 700; color: rgba(255, 255, 255, 0.7); margin-bottom: 2px; }
    .pin-notice-text { font-size: 14px; font-weight: 700; line-height: 1.45; text-wrap: pretty; }

    /* ── "내 채팅이 고정됐어요" 배너 ── 채팅 화면 위쪽에서 슬라이드 다운, 작성자 폰에만 뜸 */
    .pin-banner {
      position: absolute;
      left: 12px;
      right: 12px;
      top: var(--pin-top, 12px); /* JS가 헤더(공지 띠가 있으면 그 아래) 아래 끝 + 8px로 지정 — 헤더·공지를 덮지 않게 */
      background: var(--ink);
      color: var(--surface);
      border-radius: 14px;
      padding: 12px 14px;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.4;
      word-break: keep-all;
      overflow-wrap: break-word;
      transform: translateY(calc(-100% - var(--pin-top, 12px) - 16px)); /* 숨김: 화면 위 밖 (그림자까지) */
      transition: transform 0.55s cubic-bezier(0.22, 0.75, 0.25, 1);
      z-index: 40;
      box-shadow: var(--shadow-lg);
    }
    .pin-banner small {
      display: block;
      font-weight: 600;
      opacity: 0.8;
      font-size: 12px;
      margin-top: 2px;
    }
    .pin-banner.show { transform: translateY(0); }

    /* 색종이 조각 (WAAPI로 날리고 끝나면 제거) */
    .pin-confetti {
      position: absolute;
      width: 7px;
      height: 4px;
      border-radius: 1px;
      pointer-events: none;
      z-index: 39;
    }

    #send-btn {
      width: 34px;
      height: 34px;
      background: var(--ink);
      color: var(--surface); /* 화살표 아이콘(stroke=currentColor) 색 */
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }

    #send-btn:disabled { opacity: 0.3; cursor: default; }

    #send-btn svg { width: 16px; height: 16px; }
  </style>
</head>
<body>

<!-- 입장 화면 -->
<div id="entrance">
  <h1>오늘의 토론에 참여하세요</h1>
  <p>아래 닉네임으로 익명 채팅에 참여합니다.<br>마음에 들지 않으면 다시 뽑아보세요.</p>

  <div class="nickname-card">
    <div class="nickname-label">나의 닉네임</div>
    <div id="nickname-display">로딩 중...</div>
  </div>

  <button class="btn-reroll" onclick="rerollNickname()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
    </svg>
    다른 닉네임 뽑기
  </button>

  <button class="btn-enter" onclick="enterChat()">이 닉네임으로 참여하기</button>
</div>

<!-- 채팅 화면 -->
<div id="chatroom">
  <!-- 내 채팅이 LED에 고정됐을 때만 작성자 폰에 뜨는 배너 (색종이는 JS가 동적 추가) -->
  <div class="pin-banner" id="pin-banner" role="status" aria-live="polite">
    내 채팅이 LED에 고정됐어요!<small>지금 무대 화면을 봐 주세요</small>
  </div>

  <div id="chat-content">
    <div id="chat-header">
      <div class="avatar" id="header-avatar">?</div>
      <div class="header-info">
        <div class="header-title" id="header-nickname"></div>
        <div class="header-sub">익명 토론 채팅</div>
      </div>
    </div>

    <!-- 운영진 공지 핀 (관리자가 운영진 채팅을 핀하면 표시) -->
    <div class="pin-notice" id="pin-notice" role="status">
      <span class="pin-notice-icon" aria-hidden="true">📢</span>
      <div class="pin-notice-body">
        <div class="pin-notice-nick" id="pin-notice-nick"></div>
        <div class="pin-notice-text" id="pin-notice-text"></div>
      </div>
    </div>

    <div id="messages"></div>
    <button class="new-msg-pill" id="new-msg-pill" type="button" onclick="jumpToLatest()">새 메시지 ↓</button>

    <div class="notice-bar" id="notice-bar" role="status" aria-live="polite"></div>

    <div id="input-area">
      <button class="react-btn" id="react-heart" onclick="sendReaction('heart')">❤️</button>
      <button class="react-btn" id="react-thumbs" onclick="sendReaction('thumbs')">👍</button>
      <textarea id="msg-input" placeholder="메시지 입력..." rows="1" maxlength="200"></textarea>
      <span id="char-counter">0/200</span>
      <button id="send-btn" onclick="sendMessage()" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- 투표 오버레이 -->
  <div id="voting-overlay">
    <div id="voting-card">
      <div id="voting-timer-phone">30</div>
      <div id="voting-question-phone"></div>
      <div class="timer-gauge" id="voting-timer-gauge"><div class="timer-gauge-fill"></div></div>
      <!-- 보기 버튼/비율은 질문 유형(YES/NO·N지선다)에 맞춰 JS가 동적 생성 -->
      <div id="voting-buttons"></div>
      <!-- 내 공 미니 원 (투표 중에만, 시안 1) — 그리기는 VoteMini -->
      <div class="vote-mini" id="vote-mini">
        <canvas class="vote-mini-canvas" id="vote-mini-canvas" aria-hidden="true"></canvas>
        <div class="vote-mini-hint" id="vote-mini-hint">투표하면 내 공이 여기 들어가요</div>
      </div>
      <div id="voting-ratio">
        <div class="ratio-bar" id="ratio-bar"></div>
        <div class="ratio-text" id="ratio-text"></div>
      </div>

      <!-- 이모지 반응 질문 전용: 이모지 선택 (여러 번 탭 가능) -->
      <div id="emoji-buttons"></div>

      <!-- 주관식 모드 전용: 자유 텍스트 답변 (1인 1회, 20자) -->
      <div id="subjective-wrap">
        <div id="subjective-form">
          <input type="text" id="answer-input" maxlength="20" placeholder="20자 이내로 답해주세요">
          <button id="answer-submit" onclick="submitAnswer()">보내기</button>
        </div>
        <div id="answer-done">답변이 접수됐어요! LED 화면을 봐주세요&nbsp;👀</div>
      </div>

      <!-- 결과 모드 전용: 결과에 붐업/붐따로 반응 -->
      <div id="result-react">
        <div id="result-react-hint">이 결과, 어떻게 생각하세요?</div>
        <div id="result-react-buttons">
          <button class="result-react-btn" onclick="sendReaction('thumbs', this)">👍</button>
          <button class="result-react-btn" onclick="sendReaction('down', this)">👎</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/nickname-themes.js"></script>
<script>
  // ── 테마 ──
  // 행사마다 닉네임 풀과 입장 문구가 다르다. 주소로 테마를 고른다.
  //   /          → office  (12월 본 공연: 직장인 썰루션 토크콘서트)
  //   /concert   → concert (공연장 현장 테스트용)
  // ?theme=xxx 로도 지정 가능. 닉네임 단어 목록은 서버와 같은 파일(/nickname-themes.js)을 쓴다
  // → 닉네임이 중복돼 서버가 교체해줄 때도 같은 테마의 닉네임이 내려온다.
  const THEMES = {
    office: {
      title: '익명 채팅',
      heading: '오늘의 토론에 참여하세요',
      headerSub: '익명 토론 채팅',
      ...NICKNAME_WORDS.office, // prefixes·suffixes
    },
    concert: {
      title: '공연 실시간 채팅',
      heading: '오늘 공연에 함께해주세요',
      headerSub: '실시간 익명 채팅',
      ...NICKNAME_WORDS.concert, // prefixes·suffixes
    },
  };

  // 주소로 테마 결정 (?theme= 우선, 없으면 경로)
  const themeKey = (() => {
    const q = new URLSearchParams(location.search).get('theme');
    if (q && Object.prototype.hasOwnProperty.call(THEMES, q)) return q;
    const path = location.pathname.replace(/\/+$/, '').split('/').pop();
    return Object.prototype.hasOwnProperty.call(THEMES, path) ? path : 'office';
  })();
  const theme = THEMES[themeKey];
  const PREFIXES = theme.prefixes;
  const SUFFIXES = theme.suffixes;

  // 테마별 문구 반영
  document.title = theme.title;
  document.querySelector('#entrance h1').textContent = theme.heading;
  document.querySelector('#chat-header .header-sub').textContent = theme.headerSub;

  let nicknamePool = [];
  let poolIndex = 0;

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function initNicknamePool() {
    const pool = [];
    for (const p of PREFIXES) {
      for (const s of SUFFIXES) {
        pool.push(`${p} ${s}`);
      }
    }
    nicknamePool = shuffle(pool);
    poolIndex = 0;
  }

  function getNewNickname() {
    if (nicknamePool.length === 0 || poolIndex >= nicknamePool.length) {
      initNicknamePool();
    }
    return nicknamePool[poolIndex++];
  }

  let currentNickname = '';
  let socket;
  let nickSocket;

  // ── 영구 클라이언트 ID (localStorage) — 투표 중복 방지 키 ──
  function getClientId() {
    // 저장소가 막힌 브라우저에선 localStorage 접근이 예외 → 페이지가 멈추지 않게 이번 접속용 ID로 대신
    let id = null;
    try { id = localStorage.getItem('ledClientId'); } catch (e) {}
    if (!id) {
      id = 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
      try { localStorage.setItem('ledClientId', id); } catch (e) {}
    }
    return id;
  }
  const clientId = getClientId();

  // ── 닉네임 기억 (localStorage, 테마별) ──
  // 폰에서 다른 앱을 쓰는 동안 브라우저가 탭을 메모리에서 내리면 돌아왔을 때 페이지가 다시 열린다.
  // 그때도 같은 닉네임·같은 화면(입장했으면 채팅방)으로 이어지게 저장해 둔다. 오래된 기록(다른 날 행사)은 버린다.
  const SAVED_NICK_KEY = 'ledNickname:' + themeKey;
  const SAVED_NICK_MAX_AGE = 12 * 60 * 60 * 1000;
  function loadSavedNickname() {
    try {
      const v = JSON.parse(localStorage.getItem(SAVED_NICK_KEY) || 'null');
      if (!v || typeof v.name !== 'string' || Date.now() - v.t > SAVED_NICK_MAX_AGE) return null;
      // 단어 목록이 바뀌어 지금 풀에 없는 닉네임이면 새로 뽑는다
      if (!PREFIXES.some(p => SUFFIXES.some(x => `${p} ${x}` === v.name))) return null;
      return v;
    } catch (e) { return null; }
  }
  function saveNickname(entered) {
    try { localStorage.setItem(SAVED_NICK_KEY, JSON.stringify({ name: currentNickname, entered: !!entered, t: Date.now() })); } catch (e) {}
  }
  const savedNick = loadSavedNickname();
  let hasEntered = false;

  function requestNickname(name) {
    currentNickname = name || getNewNickname();
    document.getElementById('nickname-display').textContent = currentNickname;
    saveNickname(hasEntered);

    if (!nickSocket) {
      // clientId를 접속 시점에 함께 보낸다(끊긴 동안 누른 투표가 재접속 때 버려지지 않도록)
      nickSocket = io({ auth: { clientId } });

      // 연결 상태 안내 — 끊기면 입력창 위에 계속 표시, 다시 연결되면 숨김
      nickSocket.on('disconnect', () => showNotice('연결이 끊겼어요. 다시 연결하는 중…', { sticky: true }));
      nickSocket.on('connect', hideNotice);
      // 연결 완료 후 identify + 닉네임 중복 확인 요청
      nickSocket.on('connect', () => {
        nickSocket.emit('identify', clientId);
        nickSocket.emit('claimNickname', { name: currentNickname, theme: themeKey });
      });
      // 서버가 동시 접속자와의 닉네임 중복을 감지하면 새 닉네임으로 교체
      nickSocket.on('nicknameReassigned', applyReassignedNickname);
      // 이전 메시지 수신
      nickSocket.on('history', (messages) => {
        document.getElementById('messages').innerHTML = ''; // 재연결 시 중복 방지
        messages.forEach(addMessage);
        scrollToBottom();
      });
      // 새 메시지 수신
      // 맨 아래를 보고 있을 때만 따라 내려감(운영진 화면과 같은 방식) — 위로 올려 읽는 중이면 위치 유지 + "새 메시지" 알림.
      // 내가 방금 보낸 글이 돌아오면 그때는 맨 아래로
      nickSocket.on('chat', (msg) => receiveMessages([msg]));
      // 채팅이 몰릴 때 서버가 묶어서 보내는 메시지 (화면 갱신·스크롤은 한 번만)
      nickSocket.on('chatBatch', (list) => receiveMessages(list));
      // 관리자가 채팅을 초기화하면 내 화면의 목록도 비운다
      nickSocket.on('chatCleared', () => {
        document.getElementById('messages').innerHTML = '';
        pendingPinId = null; // 지워진 글의 핀 알림은 띄우지 않음
      });
      // 관리자가 개별 채팅을 삭제하면 내 화면에서도 제거
      nickSocket.on('chatDeleted', (id) => {
        const el = document.querySelector('#messages [data-id="' + CSS.escape(String(id)) + '"]');
        if (el) el.remove();
        if (pendingPinId != null && String(pendingPinId) === String(id)) pendingPinId = null; // 삭제된 글의 핀 알림도 버림
      });
      // 투표 상태 동기화는 입장 전에도 받아야 함 (연결 즉시 시작)
      nickSocket.on('state', applyVoteState);
      nickSocket.on('modeChange', applyVoteState);
      // 관리자가 "내 채팅"을 LED에 고정했을 때만 작성자 본인에게 옴 (다른 사람 폰에는 안 옴)
      // late: 핀 순간 끊겨 있다가 다시 접속했을 때 오는 알림 — 이 폰에서 이미 본 핀이면 다시 띄우지 않는다
      nickSocket.on('chatPinnedYou', ({ id, late }) => {
        if (late && seenPinIds().includes(String(id))) return;
        // 다른 앱을 보고 있거나 화면이 꺼져 있으면(연결은 잠시 살아 있음) 배너가 아무도 못 보는 사이 사라진다
        // → 돌아와 화면이 다시 보일 때 띄운다
        if (document.visibilityState === 'hidden') { pendingPinId = id; return; }
        rememberSeenPin(id);
        showPinnedYou(id);
      });
      // 운영진 공지 핀 (모든 관객에게) — 채팅 맨 위 띠
      nickSocket.on('noticePinned', (data) => renderPinNotice(data && data.message));
    } else {
      // 이미 연결돼 있으면(리롤 등) 새로 고른 닉네임을 서버에 다시 등록
      nickSocket.emit('claimNickname', { name: currentNickname, theme: themeKey });
    }
  }

  // 핀 알림을 이미 본 메시지 id (재접속할 때마다 같은 축하가 반복되지 않게, 최근 20개만)
  function seenPinIds() {
    try { return JSON.parse(localStorage.getItem('ledPinSeen') || '[]'); } catch (e) { return []; }
  }
  function rememberSeenPin(id) {
    const ids = seenPinIds().filter(x => x !== String(id));
    ids.push(String(id));
    try { localStorage.setItem('ledPinSeen', JSON.stringify(ids.slice(-20))); } catch (e) {}
  }

  // 다른 앱을 쓰다 돌아오면 연결이 겉으로만 살아 있는 경우가 많다(서버·폰 모두 수십 초 뒤에야 알아챔).
  // 돌아온 즉시 서버에 확인해 답이 없으면 바로 다시 연결한다 → 그 사이 놓친 채팅·핀 알림을 곧장 받는다.
  let hiddenAt = 0;
  let pendingPinId = null; // 화면이 안 보일 때 받은 핀 알림 — 돌아오면 띄운다
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); return; }
    if (pendingPinId != null) {
      const id = pendingPinId;
      pendingPinId = null;
      rememberSeenPin(id);
      showPinnedYou(id);
    }
    if (!nickSocket || !hiddenAt || Date.now() - hiddenAt < 3000) return;
    hiddenAt = 0;
    if (!nickSocket.connected) { nickSocket.connect(); return; }
    nickSocket.timeout(3000).emit('alive', (err) => {
      if (!err) return;
      nickSocket.disconnect();
      nickSocket.connect();
    });
  });

  // 서버가 동시 중복을 감지해 새 닉네임을 내려주면 화면에 반영
  function applyReassignedNickname(name) {
    currentNickname = name;
    saveNickname(hasEntered);
    const display = document.getElementById('nickname-display');
    if (display) display.textContent = name;
    const headerNick = document.getElementById('header-nickname');
    if (headerNick) headerNick.textContent = name;
    const headerAvatar = document.getElementById('header-avatar');
    if (headerAvatar) headerAvatar.textContent = name.charAt(0);
  }

  // ══════════════════════════════════
  //  투표 모드 (관객 폰)
  // ══════════════════════════════════
  let currentMode = 'chat';
  let myVote = null;        // 내가 고른 보기 인덱스(0-based) 또는 null
  let voteOptions = [];     // 현재 질문의 보기 라벨 배열
  let voteTypeCur = 'yesno';// 'yesno' | 'choice'
  let answerMax = 20;       // 현재 주관식 최대 글자수
  let phoneTimerInterval = null;
  let phoneVoteDeadline = null; // 이 기기 Date.now() 기준 마감 시각 (서버가 보낸 남은 ms를 받은 순간에 더해 계산)
  let phoneVoteTotalMs = 0;     // 설정한 투표 시간(ms) — 게이지 비율 계산용

  let myAnswerDone = false; // 주관식 답변 완료 여부 (1인 1회)

  // 보기 색 팔레트 (LED와 순서 동일하게 유지 — 같은 보기 = 같은 색)
  const YESNO_STYLES = [
    { tint: '#ffe6db', strong: '#fb7e55', on: '#b5502e' }, // YES 오렌지
    { tint: '#e3e3f7', strong: '#5b5cc4', on: '#3d3e96' }, // NO 인디고
  ];
  const OPTION_STYLES = [
    { tint: '#ffe6db', strong: '#fb7e55', on: '#b5502e' },
    { tint: '#e3e3f7', strong: '#5b5cc4', on: '#3d3e96' },
    { tint: '#dcf3f0', strong: '#2fb3a3', on: '#1f7f74' },
    { tint: '#fdeed8', strong: '#f2a03d', on: '#a86c1c' },
    { tint: '#fbe2ea', strong: '#e3557f', on: '#a83458' },
    { tint: '#e4e4ee', strong: '#4a4a7a', on: '#33335c' },
  ];
  function voteStyles(type) { return type === 'yesno' ? YESNO_STYLES : OPTION_STYLES; }

  function renderVoteButtons(options, type) {
    const el = document.getElementById('voting-buttons');
    el.innerHTML = '';
    const styles = voteStyles(type);
    options.forEach((label, i) => {
      const s = styles[i % styles.length];
      const b = document.createElement('button');
      b.className = 'vote-btn';
      const head = document.createElement('span');
      head.className = 'vote-btn-head';
      const name = document.createElement('span'); // 헤더 안 한 덩어리(세로 가운데 정렬 대상 — 글자 조각이 flex 항목으로 흩어지지 않게)
      name.className = 'vote-btn-name';
      head.appendChild(name);
      // 12자 넘게 붙은 덩어리만 span.long-word(글자 단위 줄바꿈), 나머지는 그대로 — 사용자 글이라 textContent로만 넣음
      String(label).split(/(\S{12,})/).forEach((part, k) => {
        if (!part) return;
        if (k % 2) {
          const run = document.createElement('span');
          run.className = 'long-word';
          run.textContent = part;
          name.appendChild(run);
        } else name.appendChild(document.createTextNode(part));
      });
      const body = document.createElement('span');
      body.className = 'vote-btn-body'; // 투표 중엔 선택 표시(✓), 결과에선 비율(%)
      b.appendChild(head);
      b.appendChild(body);
      b.style.setProperty('--strong', s.strong);
      b.addEventListener('click', () => castVote(i));
      el.appendChild(b);
    });
    el.classList.toggle('grid', options.length > 2);
  }

  function renderEmojiButtons(options) {
    const el = document.getElementById('emoji-buttons');
    el.innerHTML = '';
    (options || []).forEach((opt) => {
      const emoji = opt && opt.emoji ? opt.emoji : '';
      const label = opt && opt.label ? opt.label : '';
      const b = document.createElement('button');
      b.className = 'emoji-btn';
      const icon = document.createElement('span');
      icon.className = 'emoji-btn-icon';
      icon.textContent = emoji;
      b.appendChild(icon);
      if (label) {
        const l = document.createElement('span');
        l.className = 'emoji-btn-label';
        l.textContent = label;
        b.appendChild(l);
      }
      b.addEventListener('click', () => pickEmoji(emoji, b));
      el.appendChild(b);
    });
  }

  // 운영진 공지 핀 — 관리자가 운영진 채팅을 핀하면 채팅 맨 위에 고정 (null이면 숨김)
  let pinNoticeKey = null;
  function renderPinNotice(msg) {
    const box = document.getElementById('pin-notice');
    const key = msg ? JSON.stringify([msg.id, msg.nickname, msg.text]) : null;
    if (key === pinNoticeKey) return; // 같은 공지 재전송이면 등장 애니메이션을 다시 틀지 않음
    pinNoticeKey = key;
    keepBottomWhile(() => {
      box.classList.remove('visible');
      if (!msg) return;
      document.getElementById('pin-notice-nick').textContent = msg.nickname || '';
      document.getElementById('pin-notice-text').textContent = msg.text || '';
      void box.offsetWidth; // 교체 때도 팝인 재시작
      box.classList.add('visible');
    });
  }

  function applyVoteState(state) {
    const prevMode = currentMode;
    currentMode = state.mode;
    // 핀은 채팅 모드에서만 걸려 있다(다른 모드로 가면 서버가 내림) → 화면이 꺼져 있던 동안 받아 둔 핀 알림은 버린다
    // (안 그러면 엔딩·질문 중에 폰으로 돌아왔을 때 이미 내려간 핀의 "LED에 고정됐어요"가 뜸)
    if (state.mode !== 'chat') pendingPinId = null;
    renderPinNotice(state.pinnedNotice);
    const overlay = document.getElementById('voting-overlay');
    const chatContent = document.getElementById('chat-content');
    const resultReact = document.getElementById('result-react');
    const subjectiveWrap = document.getElementById('subjective-wrap');

    // chat·idle(대기 화면)·ending(엔딩 슬라이드) — 세 모드 모두 채팅이 열려 있어야 함(서버 CHAT_MODES와 동일)
    if (state.mode === 'chat' || state.mode === 'idle' || state.mode === 'ending') {
      overlay.classList.remove('active');
      chatContent.classList.remove('blurred');
      resultReact.classList.remove('active');
      subjectiveWrap.classList.remove('active', 'answered');
      myVote = null;
      myAnswerDone = false;
      stopPhoneTimer();
      updateVoteUI();
      VoteMini.hide(); // 투표 중 바로 채팅·대기·엔딩으로 넘어가도 미니 원 애니메이션(숨쉬기)을 멈추고 지난 공을 지운다
      return;
    }

    chatContent.classList.add('blurred');
    overlay.classList.add('active');
    // 새 투표 질문 시작 시 내 선택 초기화, 재접속이면 서버 값(인덱스) 복원
    // (결과 화면에서 바로 다음 투표를 시작해도 새 질문 — 서버는 표를 비우므로 지난 선택(✓)을 남기지 않는다)
    if (state.mode === 'voting' && prevMode !== 'voting') myVote = null;
    if (state.myVote != null) myVote = state.myVote;

    // 새 주관식 질문 시작 시 답변 상태 초기화
    if (state.mode === 'subjective' && prevMode !== 'subjective') {
      myAnswerDone = false;
      document.getElementById('answer-input').value = '';
    }
    if (state.myAnswered === true) myAnswerDone = true; // 재접속 시 서버 기준 복원

    const questionEl = document.getElementById('voting-question-phone');
    const timerEl = document.getElementById('voting-timer-phone');
    const buttonsEl = document.getElementById('voting-buttons');
    const ratioEl = document.getElementById('voting-ratio');

    // 공통: 질문은 항상 표시 (결과에서도 유지)
    questionEl.style.display = 'block';
    questionEl.textContent = state.question || '';

    // 함성 측정 모드는 투표 카드를 그대로 재사용해 안내문만 바꿔 보여준다 (화면은 함성 레벨을 안 받으므로 안내문만)
    if (state.mode === 'applause') {
      questionEl.textContent = '지금 박수와 함성을 보내 주세요!';
    } else if (state.mode === 'applauseResult') {
      const peak = (state.applause && state.applause.peak) || 0;
      questionEl.textContent = `함성 지수 ${Math.round(peak * 100)}`;
    }

    // 모드별 요소 표시
    const isVote = state.mode === 'voting' || state.mode === 'result';
    const isEmoji = state.mode === 'emoji';
    const emojiEl = document.getElementById('emoji-buttons');

    if (isVote) {
      voteOptions = state.voteOptions || [];
      voteTypeCur = state.voteType || 'yesno';
      renderVoteButtons(voteOptions, voteTypeCur);
    }
    // 비율(%)은 결과 모드에서만 공개 — 투표 중엔 결과가 궁금하도록 숨김(LED와 동일)
    const showRatio = state.mode === 'result';
    buttonsEl.style.display = isVote ? 'flex' : 'none';
    ratioEl.style.display = showRatio ? 'block' : 'none';
    emojiEl.classList.toggle('active', isEmoji);
    if (isEmoji) renderEmojiButtons(state.emojiOptions || []);
    subjectiveWrap.classList.toggle('active', state.mode === 'subjective');

    // 주관식 글자수 제한 반영 (질문별 설정)
    if (state.mode === 'subjective') {
      answerMax = state.answerMaxLen || 20;
      const ai = document.getElementById('answer-input');
      ai.maxLength = answerMax;
      ai.placeholder = `${answerMax}자 이내로 답해주세요`;
    }

    if (state.mode === 'voting') {
      timerEl.style.display = 'inline-flex';
      resultReact.classList.remove('active');
      startPhoneTimer(state);
    } else if (state.mode === 'result') {
      timerEl.style.display = 'none';
      resultReact.classList.add('active'); // 결과에 붐업/붐따로 반응
      stopPhoneTimer();
    } else if (state.mode === 'subjective') {
      timerEl.style.display = 'none';
      resultReact.classList.remove('active');
      subjectiveWrap.classList.toggle('answered', myAnswerDone);
      stopPhoneTimer();
    } else if (state.mode === 'subjectiveResult') {
      timerEl.style.display = 'none';
      resultReact.classList.add('active'); // 워드클라우드 결과에도 붐업/붐따
      stopPhoneTimer();
    } else if (state.mode === 'emoji') {
      timerEl.style.display = 'none';
      resultReact.classList.remove('active'); // 이모지 모드는 자체 버튼만
      stopPhoneTimer();
    } else if (state.mode === 'applause' || state.mode === 'applauseResult') {
      timerEl.style.display = 'none'; // 화면 쪽 타이머/함성 레벨은 LED에만 보임
      resultReact.classList.remove('active');
      stopPhoneTimer();
    }

    updateVoteUI();
    if (showRatio) updateRatio(state.counts, voteTypeCur);
    // 미니 원은 투표 중에만 (결과에선 비율 막대가 대신함). 같은 질문이면 공 배치를 유지
    if (state.mode === 'voting') {
      VoteMini.show(voteKey(state), voteOptions, voteTypeCur);
      VoteMini.pick(myVote, false); // 재접속·재로드: 서버가 기억한 내 표를 애니메이션 없이 복원
    } else {
      VoteMini.hide();
    }
  }
  function voteKey(state) { return JSON.stringify([state.question, state.voteOptions, state.votingDuration]); }

  // ══════════════════════════════════
  //  내 공 미니 원 (시안 1) — LED 2지선다 원형 공 덩어리와 같은 방식(해바라기 배치 + 겹침 풀기 + 중심으로 당김)을 폰 크기로.
  //  다른 공은 보기마다 같은 개수의 옅은 장식 공(실제 표 수 아님 — 투표 중 비율은 비공개). 내 공만 진한 색 + 빛 번짐(숨쉬기) + 흰 점.
  //  동작 줄이기 설정이면 커지기·밀려나기·숨쉬기 없이 바로 자리 잡은 모습만.
  // ══════════════════════════════════
  const VoteMini = (() => {
    const wrap = document.getElementById('vote-mini');
    const canvas = document.getElementById('vote-mini-canvas');
    const hint = document.getElementById('vote-mini-hint');
    const ctx = canvas.getContext('2d');
    const GROW_MS = 900, PULL = 0.012, GAP = 1.06, SPACING = 1.19;
    const reduce = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
    let key = null, clusters = [], styles = [], mineAt = null, raf = null, W = 0, H = 0, R = 7;
    const cssVar = (n, d) => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || d;

    function layout(n) {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      W = canvas.clientWidth; H = canvas.clientHeight; // 카드 등장(scale) 중에도 실제 크기 (getBoundingClientRect는 변형 반영)
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const cols = n <= 4 ? n : 3, rows = Math.ceil(n / cols);
      R = n <= 2 ? 7 : n <= 4 ? 5.5 : 4.5;
      const per = n <= 2 ? 14 : n <= 4 ? 9 : 6; // 보기마다 같은 개수 (비율이 드러나지 않게)
      return Array.from({ length: n }, (_, i) => {
        const col = i % cols, row = Math.floor(i / cols);
        const inRow = Math.min(cols, n - row * cols);
        const cx = W * (col + 0.5 + (cols - inRow) / 2) / cols, cy = H * (row + 0.5) / rows;
        const balls = [];
        for (let k = 0; k < per; k++) {
          const a = k * 2.39996, r = R * 2 * SPACING * Math.sqrt(k + 0.5) / 2;
          balls.push({ x: cx + r * Math.cos(a), y: cy + r * Math.sin(a), r: R, born: -1e9, mine: false });
        }
        return { cx, cy, balls };
      });
    }
    function radius(b, now) { return b.born < 0 || reduce() ? R : R * (1 - Math.pow(1 - Math.min(1, (now - b.born) / GROW_MS), 3)); }
    function relax(c, now, k) {
      for (const b of c.balls) { b.x += (c.cx - b.x) * PULL * k; b.y += (c.cy - b.y) * PULL * k; b.r = radius(b, now); }
      for (let it = 0; it < 3; it++) {
        for (let a = 0; a < c.balls.length; a++) for (let d = a + 1; d < c.balls.length; d++) {
          const p = c.balls[a], q = c.balls[d];
          if (p.r === 0 || q.r === 0) continue;
          let dx = q.x - p.x, dy = q.y - p.y, dist = Math.hypot(dx, dy);
          const min = (p.r + q.r) * GAP;
          if (dist >= min) continue;
          if (dist < 0.01) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; dist = Math.hypot(dx, dy); }
          const push = (min - dist) * 0.5 * 0.35;
          p.x -= dx / dist * push; p.y -= dy / dist * push; q.x += dx / dist * push; q.y += dy / dist * push;
        }
      }
    }
    function dot(x, y, r, color) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); }
    function draw(now) {
      ctx.clearRect(0, 0, W, H);
      let mine = null, mineColor = null;
      clusters.forEach((c, i) => {
        const s = styles[i % styles.length];
        relax(c, now, 1);
        for (const b of c.balls) {
          if (b.mine) { mine = b; mineColor = s.strong; continue; }
          if (b.r > 0) dot(b.x, b.y, b.r, s.strong + '4d'); // 다른 공: 같은 색 30% (보기 구분은 되고 내 공보다 한참 옅게)
        }
      });
      if (mine && mine.r > 0) {
        const breathe = reduce() ? 1 : 1 + 0.18 * Math.sin(now / 520);
        const halo = mine.r * 2.6 * breathe;
        const g = ctx.createRadialGradient(mine.x, mine.y, mine.r * 0.8, mine.x, mine.y, halo);
        g.addColorStop(0, mineColor + '73'); g.addColorStop(1, mineColor + '00'); // 같은 색 45% → 0% 빛 번짐
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mine.x, mine.y, halo, 0, Math.PI * 2); ctx.fill();
        dot(mine.x, mine.y, mine.r * 1.1, mineColor);
        dot(mine.x, mine.y, mine.r * 0.38, cssVar('--surface', '#ffffff'));
      }
    }
    function loop(now) {
      draw(now);
      // 숨쉬기 때문에 내 공이 있으면 계속, 동작 줄이기면 자리 잡을 때까지만
      const settling = clusters.some(c => c.balls.some(b => now - b.born < GROW_MS + 1500));
      raf = (mineAt != null && !reduce()) || settling ? requestAnimationFrame(loop) : null;
    }
    function kick() { if (!raf) raf = requestAnimationFrame(loop); }
    function settleNow() { // 동작 줄이기·복원: 겹침 풀기를 한 번에 끝낸 모습
      for (let i = 0; i < 120; i++) clusters.forEach(c => relax(c, performance.now(), 1));
    }
    // 투표 카드가 막 보이기 시작할 때(처음엔 크기 0)·화면 회전 때 다시 배치 — 내 공은 그대로 복원
    new ResizeObserver(() => {
      if (!key || !canvas.clientWidth) return;
      const m = mineAt;
      clusters = layout(clusters.length);
      mineAt = null;
      if (m != null) api.pick(m, false); else draw(performance.now());
    }).observe(canvas);
    const api = {
      show(k, options, type) {
        wrap.classList.add('active');
        if (k === key && clusters.length === options.length) return;
        key = k; mineAt = null;
        styles = voteStyles(type);
        clusters = layout(options.length);
        hint.textContent = '투표하면 내 공이 여기 들어가요';
        draw(performance.now());
      },
      // choice: 보기 인덱스(null이면 무시). animate=false면 커지는 연출 없이 바로 자리
      pick(choice, animate) {
        if (choice == null || !clusters[choice] || choice === mineAt) return;
        clusters.forEach(c => { c.balls = c.balls.filter(b => !b.mine); }); // 표를 바꾸면 이전 쪽 내 공은 빠짐
        const c = clusters[choice];
        const a = Math.random() * Math.PI * 2;
        c.balls.push({ x: c.cx + Math.cos(a) * 1.5, y: c.cy + Math.sin(a) * 1.5, r: 0, born: animate && !reduce() ? performance.now() : -1e9, mine: true });
        mineAt = choice;
        hint.textContent = '빛나는 공이 내 공이에요';
        if (!animate || reduce()) settleNow();
        draw(performance.now());
        kick();
      },
      hide() {
        wrap.classList.remove('active');
        key = null; mineAt = null; clusters = [];
        if (raf) cancelAnimationFrame(raf);
        raf = null;
      },
    };
    return api;
  })();

  // ── 주관식 답변 제출 ──
  function submitAnswer() {
    const input = document.getElementById('answer-input');
    const text = input.value.trim().slice(0, answerMax);
    if (!text || myAnswerDone || currentMode !== 'subjective' || !nickSocket) return;
    nickSocket.emit('answer', { text });
    myAnswerDone = true; // 낙관적 반영 (서버도 1인 1회 보장)
    document.getElementById('subjective-wrap').classList.add('answered');
  }

  function updateVoteUI() {
    const btns = document.querySelectorAll('#voting-buttons .vote-btn');
    btns.forEach((b, i) => {
      b.classList.toggle('selected', myVote === i);
      b.disabled = currentMode !== 'voting';
      // 결과 모드의 % 표시를 덮어쓰지 않도록 투표 중일 때만 본문을 갱신
      if (currentMode === 'voting') {
        const body = b.querySelector('.vote-btn-body');
        if (body) body.textContent = myVote === i ? '✓' : '';
      }
    });
  }

  function updateRatio(counts, type) {
    const per = counts && counts.perOption ? counts.perOption : [];
    const total = counts && counts.total ? counts.total : 0;
    const styles = voteStyles(type || voteTypeCur);
    const bar = document.getElementById('ratio-bar');
    const txt = document.getElementById('ratio-text');
    bar.innerHTML = '';
    txt.innerHTML = '';
    voteOptions.forEach((label, i) => {
      const pct = total ? Math.round((per[i] || 0) / total * 100) : 0;
      const s = styles[i % styles.length];
      const fill = document.createElement('div');
      fill.className = 'ratio-fill';
      fill.style.width = pct + '%';
      fill.style.background = s.strong;
      bar.appendChild(fill);
      // 보기 카드 본문에도 최종 비율 표시 — 결과 모드에서만 (투표 중엔 비율 비공개)
      if (currentMode === 'result') {
        const btn = document.querySelectorAll('#voting-buttons .vote-btn')[i];
        const body = btn && btn.querySelector('.vote-btn-body');
        if (body) body.textContent = pct + '%';
      }

      const item = document.createElement('span');
      item.className = 'ratio-item';
      const dot = document.createElement('span');
      dot.className = 'ratio-dot';
      dot.style.background = s.strong;
      item.appendChild(dot);
      item.appendChild(document.createTextNode(`${label} ${pct}%`));
      txt.appendChild(item);
    });
  }

  // 서버가 보낸 남은 시간(votingRemainMs = 서버 시계로 계산한 남은 ms)을 받은 순간의 이 기기 Date.now()에 더해 마감 시각을 잡는다.
  // 서버의 votingEndTime을 이 기기 시계로 빼면 폰·PC마다 시계 차이만큼 LED와 어긋났음(시계가 5초 빠른 폰은 5초 적게 보임).
  // 받은 순간 기준이라 기기 시계가 틀려도 상관없고, performance.now()와 달리 화면이 꺼졌다 켜져도(절전) 시간이 흐른 만큼 반영된다.
  function startPhoneTimer(state) {
    const remainMs = Math.max(0, Number(state.votingRemainMs) || 0);
    phoneVoteDeadline = Date.now() + remainMs;
    phoneVoteTotalMs = (Number(state.votingDuration) || 0) * 1000;
    startTimerGauge();
    tickPhoneTimer();
  }

  // 숫자는 초가 바뀌는 순간에 맞춰 갱신 — 200ms 간격 폴링이면 화면마다 최대 0.2초씩 늦게 바뀌어 LED·폰 숫자가 엇갈려 보였다
  function tickPhoneTimer() {
    if (phoneTimerInterval) clearTimeout(phoneTimerInterval);
    phoneTimerInterval = null;
    updatePhoneTimerDisplay();
    if (phoneVoteDeadline == null) return;
    const r = phoneVoteDeadline - Date.now();
    if (r > 0) phoneTimerInterval = setTimeout(tickPhoneTimer, ((r - 1) % 1000) + 1 + 15);
  }

  function stopPhoneTimer() {
    if (phoneTimerInterval) clearTimeout(phoneTimerInterval);
    phoneTimerInterval = null;
    phoneVoteDeadline = null;
    document.getElementById('voting-timer-phone').classList.remove('hot');
    stopTimerGauge();
  }

  function updatePhoneTimerDisplay() {
    if (phoneVoteDeadline == null) return;
    const remain = Math.max(0, Math.ceil((phoneVoteDeadline - Date.now()) / 1000));
    const timerEl = document.getElementById('voting-timer-phone');
    timerEl.textContent = remain;
    // 마지막 5초만 경고색 + 맥박 (0에서는 멈춤) — 게이지도 같은 시점에 경고색
    const hotNow = remain > 0 && remain <= 5;
    timerEl.classList.toggle('hot', hotNow);
    document.getElementById('voting-timer-gauge').classList.toggle('hot', hotNow);
  }

  // ── 타이머 게이지 ── 숫자와 같은 마감 시각(phoneVoteDeadline)에서 지금 비율을 계산해 0까지 linear로 줄인다.
  // Web Animations로 돌려서 닉네임 입력 화면처럼 게이지가 안 보일 때 질문이 시작돼도 시간은 흐르고,
  // 화면에 나타나는 순간 숫자와 같은 위치에 있다(CSS transition은 안 보이는 동안 시작되지 않아 빈 막대로 보였음).
  let timerGaugeAnim = null;
  function startTimerGauge() {
    const gauge = document.getElementById('voting-timer-gauge');
    const fill = gauge.firstElementChild;
    if (timerGaugeAnim) { timerGaugeAnim.cancel(); timerGaugeAnim = null; }
    if (phoneVoteDeadline == null) return;
    const remainMs = Math.max(0, phoneVoteDeadline - Date.now());
    const frac = phoneVoteTotalMs > 0 ? Math.min(1, remainMs / phoneVoteTotalMs) : 0;
    gauge.classList.add('active');
    fill.style.transform = 'scaleX(0)'; // 끝난 뒤 머무는 모양
    if (remainMs > 0 && fill.animate) {
      timerGaugeAnim = fill.animate([{ transform: `scaleX(${frac})` }, { transform: 'scaleX(0)' }],
        { duration: remainMs, easing: 'linear' });
    }
  }
  function stopTimerGauge() {
    const gauge = document.getElementById('voting-timer-gauge');
    if (timerGaugeAnim) { timerGaugeAnim.cancel(); timerGaugeAnim = null; }
    gauge.classList.remove('active', 'hot');
  }
  // 화면이 꺼졌다 켜지거나 앱을 다시 열면 숫자·게이지를 마감 시각에 다시 맞춘다
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || phoneVoteDeadline == null) return;
    startTimerGauge();
    tickPhoneTimer();
  });

  // ── 리액션 (하트/붐업/붐따) ──
  let lastReactionAt = 0;
  function sendReaction(type, btnEl) {
    const now = Date.now();
    if (now - lastReactionAt < 250) return; // 연타 제한
    lastReactionAt = now;
    if (!nickSocket || currentMode === 'voting' || currentMode === 'subjective') return;
    nickSocket.emit('reaction', { type });

    const btn = btnEl || document.getElementById(type === 'heart' ? 'react-heart' : 'react-thumbs');
    if (!btn) return;
    btn.classList.remove('pop');
    void btn.offsetWidth; // 애니메이션 재시작 트릭
    btn.classList.add('pop');
  }

  function castVote(choice) {
    if (currentMode !== 'voting' || !nickSocket) return;
    myVote = choice; // 보기 인덱스
    updateVoteUI();
    nickSocket.emit('vote', { choice });
    VoteMini.pick(choice, true); // 미니 원: 내 공이 가운데에서 커지며 기존 공을 밀어냄
    flyVoteBall(choice); // 비율은 숨기고, 날아가는 공 + 토스트로만 "반영됨"을 알림
  }

  // 투표 피드백: 탭한 버튼에서 공이 날아올라 화면 위쪽에서 사라진 뒤 토스트 표시 (표 바꾸면 매번 반복)
  function flyVoteBall(choice) {
    const btn = document.querySelectorAll('#voting-buttons .vote-btn')[choice];
    if (!btn) return;
    const rect = btn.getBoundingClientRect();
    const styles = voteStyles(voteTypeCur);
    const color = (styles[choice % styles.length] || {}).strong || 'var(--ink)';
    const ball = document.createElement('div');
    ball.className = 'vote-fly';
    ball.style.background = color;
    ball.style.left = (rect.left + rect.width / 2 - 8) + 'px';
    ball.style.top = (rect.top + rect.height / 2 - 8) + 'px';
    document.body.appendChild(ball);

    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const riseBy = rect.top + rect.height / 2 - 40; // 화면 위쪽 근처까지
    ball.animate(
      [
        { transform: 'translate(0, 0) scale(1)', opacity: 1 },
        { transform: `translate(0, ${-riseBy}px) scale(0.5)`, opacity: 0 },
      ],
      { duration: reduce ? 1 : 750, easing: 'cubic-bezier(0.3, 0.7, 0.3, 1)' }
    ).onfinish = () => ball.remove();

    showNotice('내 표가 LED에 반영됐어요', { duration: 2000 });
  }

  // 이모지 반응 질문: 이모지 선택 → LED에 떠오름 (여러 번 탭 가능, 250ms 연타 제한)
  let lastEmojiAt = 0;
  function pickEmoji(emoji, btnEl) {
    const now = Date.now();
    if (now - lastEmojiAt < 250) return;
    lastEmojiAt = now;
    if (currentMode !== 'emoji' || !nickSocket) return;
    nickSocket.emit('emojiPick', { emoji });
    if (btnEl) { btnEl.classList.remove('pop'); void btnEl.offsetWidth; btnEl.classList.add('pop'); }
  }

  function rerollNickname() {
    requestNickname();
  }

  function enterChat() {
    if (!currentNickname) return;

    // 닉네임 요청에 쓰던 소켓을 채팅에 재사용
    socket = nickSocket;
    hasEntered = true;
    saveNickname(true);

    // UI 전환
    document.getElementById('entrance').style.display = 'none';
    const chatroom = document.getElementById('chatroom');
    chatroom.style.display = 'flex';

    const initial = currentNickname.charAt(0);
    document.getElementById('header-avatar').textContent = initial;
    document.getElementById('header-nickname').textContent = currentNickname;
  }

  function addMessage(msg) {
    const messages = document.getElementById('messages');
    const group = document.createElement('div');
    group.className = 'msg-group';
    if (msg.id != null) group.dataset.id = msg.id;

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble' + (msg.isOperator ? ' operator' : '');

    const nick = document.createElement('div');
    nick.className = 'msg-nickname';
    nick.textContent = msg.nickname;

    const text = document.createElement('div');
    text.className = 'msg-text';
    text.textContent = msg.text;

    bubble.appendChild(nick);
    bubble.appendChild(text);
    group.appendChild(bubble);
    messages.appendChild(group);
  }

  function scrollToBottom() {
    const messages = document.getElementById('messages');
    messages.scrollTop = messages.scrollHeight;
    hideNewMsgPill();
  }

  // 새 채팅 받기: 맨 아래였거나 내가 보낸 글이면 맨 아래로, 아니면 읽던 자리 그대로 두고 "새 메시지" 알림
  let pendingOwnText = null; // 방금 보낸 글 (서버를 거쳐 돌아오면 맨 아래로 내려 보여 줌)
  function receiveMessages(list) {
    const atBottom = isNearBottom();
    let mine = false;
    list.forEach((m) => {
      if (pendingOwnText != null && m && m.nickname === currentNickname && m.text === pendingOwnText) { mine = true; pendingOwnText = null; }
      addMessage(m);
    });
    if (atBottom || mine) scrollToBottom();
    else showNewMsgPill();
  }
  function showNewMsgPill() {
    const pill = document.getElementById('new-msg-pill');
    const content = document.getElementById('chat-content').getBoundingClientRect();
    const list = document.getElementById('messages').getBoundingClientRect();
    pill.style.bottom = Math.round(content.bottom - list.bottom + 10) + 'px'; // 목록 아래 끝(입력창·안내 띠 위) 10px 위
    pill.classList.add('visible');
  }
  function hideNewMsgPill() { document.getElementById('new-msg-pill').classList.remove('visible'); }
  // 직접 맨 아래까지 내리면 알림을 거둠
  document.getElementById('messages').addEventListener('scroll', () => { if (isNearBottom()) hideNewMsgPill(); }, { passive: true });
  function jumpToLatest() {
    const messages = document.getElementById('messages');
    messages.scrollTo({ top: messages.scrollHeight, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    hideNewMsgPill();
  }

  // 목록이 맨 아래(20px 안쪽)에 있는지 — 운영진 화면(host.html)과 같은 기준
  function isNearBottom() {
    const box = document.getElementById('messages');
    return box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
  }
  // 목록 위·아래 띠(공지·안내 띠)를 켜고 끄면 목록 높이가 바뀐다 →
  // 바꾸기 전에 맨 아래였으면 바꾼 뒤에도 맨 아래로(안 그러면 최신 채팅이 띠 뒤로 밀려 보이지 않음)
  function keepBottomWhile(change) {
    const wasBottom = isNearBottom();
    change();
    if (!wasBottom) return;
    scrollToBottom();
    requestAnimationFrame(scrollToBottom); // 레이아웃이 다음 프레임에 확정되는 경우까지
  }

  // ── "내 채팅이 고정됐어요" 알림 ── 배너+색종이는 항상, 말풍선 물들임은 목록에 남아있을 때만
  let pinBannerTimer = null;
  function showPinnedYou(id) {
    const banner = document.getElementById('pin-banner');
    // 헤더 아래(운영진 공지 띠가 떠 있으면 그 아래)에 8px 띄워 내려옴 — 헤더를 덮거나 공지 띠에 맞닿지 않게
    const root = document.getElementById('chatroom').getBoundingClientRect();
    const notice = document.getElementById('pin-notice');
    const above = notice.classList.contains('visible') ? notice : document.getElementById('chat-header');
    banner.style.setProperty('--pin-top', Math.round(above.getBoundingClientRect().bottom - root.top + 8) + 'px');
    banner.classList.add('show');
    clearTimeout(pinBannerTimer);
    pinBannerTimer = setTimeout(() => banner.classList.remove('show'), 4000);
    spawnPinConfetti();

    // data-id로 해당 말풍선을 찾아 잠시 물들인다 (특수문자 섞인 id도 안전하게 매칭)
    const group = document.querySelector('#messages [data-id="' + CSS.escape(String(id)) + '"]');
    const bubble = group && group.querySelector('.msg-bubble');
    if (bubble) {
      bubble.classList.add('pinned');
      clearTimeout(bubble._pinTimer);
      bubble._pinTimer = setTimeout(() => bubble.classList.remove('pinned'), 6000);
    }
  }

  function spawnPinConfetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; // 장식용 모션은 생략
    const root = document.getElementById('chatroom');
    const colors = OPTION_STYLES.map((s) => s.strong);
    const COUNT = 26;
    for (let i = 0; i < COUNT; i++) {
      const piece = document.createElement('div');
      piece.className = 'pin-confetti';
      piece.style.background = colors[i % colors.length];
      piece.style.left = (40 + Math.random() * 20) + '%';
      piece.style.top = '14%';
      root.appendChild(piece);
      const dx = (Math.random() - 0.5) * 220;
      const dy = 160 + Math.random() * 180;
      const rot = (Math.random() - 0.5) * 720;
      piece.animate(
        [
          { transform: 'translate(0, 0) rotate(0deg)', opacity: 1 },
          { transform: `translate(${dx}px, ${dy}px) rotate(${rot}deg)`, opacity: 0 },
        ],
        { duration: 1300 + Math.random() * 500, easing: 'cubic-bezier(0.2, 0.6, 0.3, 1)' }
      ).onfinish = () => piece.remove();
    }
  }

  // ── 안내 띠 ── 연결 끊김(sticky)은 다시 연결될 때까지 유지, 전송 안내는 3초 뒤 사라짐
  let noticeTimer = null;
  function showNotice(text, { warn = false, sticky = false, duration = 3000 } = {}) {
    const bar = document.getElementById('notice-bar');
    if (!sticky && bar.dataset.sticky === '1') return; // 연결 끊김 안내가 우선
    clearTimeout(noticeTimer);
    bar.textContent = text;
    bar.classList.toggle('warn', warn);
    bar.dataset.sticky = sticky ? '1' : '';
    keepBottomWhile(() => {
      bar.classList.remove('visible');
      void bar.offsetWidth; // 연속 표시 때 팝인 애니메이션 재시작
      bar.classList.add('visible');
    });
    if (!sticky) noticeTimer = setTimeout(hideNotice, duration);
  }
  function hideNotice() {
    const bar = document.getElementById('notice-bar');
    clearTimeout(noticeTimer);
    keepBottomWhile(() => bar.classList.remove('visible'));
    bar.dataset.sticky = '';
  }

  function sendMessage() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text || !socket) return;

    // 연결이 끊긴 동안엔 보내지 않고 입력 내용을 그대로 둔다(안내 띠가 이미 떠 있음)
    if (!socket.connected) {
      showNotice('연결이 끊겨 보내지 못했어요. 연결되면 다시 보내주세요.', { warn: true });
      return;
    }
    const sent = text.slice(0, MAX_CHAT_LENGTH);
    pendingOwnText = sent; // 돌아오면 맨 아래로 (서버가 비속어를 가리면 글이 달라져 못 알아볼 수 있음 — 그땐 맨 아래일 때만 따라감)
    // 서버가 결과를 알려준다 — 거절되면 이유를 안내하고 보내려던 내용을 되살린다
    socket.timeout(5000).emit('chat', { nickname: currentNickname, text: sent }, (err, res) => {
      if (err) return showNotice('전송 확인이 늦어지고 있어요. 잠시만 기다려 주세요.');
      if (!res || res.ok || res.reason === 'empty') return;
      if (res.reason === 'rate') showNotice('너무 빨리 보내고 있어요. 잠시 후 다시 보내주세요.', { warn: true });
      else if (res.reason === 'mode') showNotice(currentMode === 'applause' || currentMode === 'applauseResult'
        ? '지금은 함성 측정 중이에요. 끝나면 다시 보내 주세요.'
        : '지금은 질문에 답하는 시간이라 채팅을 보낼 수 없어요.', { warn: true });
      if (!input.value) { // 그 사이 새로 입력하지 않았다면 되살리기
        input.value = sent;
        input.dispatchEvent(new Event('input'));
      }
    });
    input.value = '';
    input.style.height = 'auto';
    document.getElementById('send-btn').disabled = true;

    const counter = document.getElementById('char-counter');
    counter.classList.remove('visible', 'limit');
  }

  const MAX_CHAT_LENGTH = 200; // 서버 server.js MAX_CHAT_LENGTH와 같게 유지

  // 입력창 auto-resize + 전송 버튼 활성화
  document.addEventListener('DOMContentLoaded', () => {
    // 기억해 둔 닉네임이 있으면 그대로 쓰고, 이미 입장했던 폰이면 입장 화면 없이 채팅방으로 돌아간다
    requestNickname(savedNick && savedNick.name);
    if (savedNick && savedNick.entered) enterChat();

    const input = document.getElementById('msg-input');
    const counter = document.getElementById('char-counter');
    input.addEventListener('input', () => {
      // maxlength 우회(붙여넣기 등) 대비 이중 방어
      if (input.value.length > MAX_CHAT_LENGTH) {
        input.value = input.value.slice(0, MAX_CHAT_LENGTH);
      }
      input.style.height = 'auto';
      input.style.height = input.scrollHeight + 'px';
      document.getElementById('send-btn').disabled = input.value.trim() === '';

      const len = input.value.length;
      counter.textContent = `${len}/${MAX_CHAT_LENGTH}`;
      counter.classList.toggle('visible', len >= 80);
      counter.classList.toggle('limit', len >= MAX_CHAT_LENGTH);
    });

    input.addEventListener('keydown', (e) => {
      if (e.isComposing) return;
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // 주관식 답변: 엔터로 제출
    document.getElementById('answer-input').addEventListener('keydown', (e) => {
      if (e.isComposing) return;
      if (e.key === 'Enter') {
        e.preventDefault();
        submitAnswer();
      }
    });
  });
</script>
</body>
</html>
