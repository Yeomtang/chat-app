<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>운영자 채팅</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── 디자인 토큰 (블러시 팔레트) ── LED 화면(led.html)과 동일한 값 유지 */
    :root {
      --bg:          #efdcd5; /* 화면 배경 (블러시) */
      --bg-soft:     #f8ece7; /* 입력창 등 보조 표면 */
      --surface:     #ffffff; /* 카드 · 말풍선 */
      --ink:         #1e1e42; /* 본문 텍스트 · 네이비 */
      --ink-soft:    #6e6a86; /* 보조 텍스트 */
      --ink-faint:   #a49eb4; /* 흐린 텍스트 · 플레이스홀더 */
      --orange:      #fb7e55; /* 1번 보기 · 강조 */
      --orange-tint: #ffe6db;
      --orange-deep: #b5502e;
      --purple:      #5b5cc4; /* 2번 보기 */
      --purple-tint: #e3e3f7;
      --warn:        #d94f3d;
      --line:        rgba(30, 30, 66, 0.10);
      --shadow:      0 8px 24px rgba(30, 30, 66, 0.08);
      --shadow-lg:   0 18px 50px rgba(30, 30, 66, 0.16);
    }

    body {
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
      background: var(--bg);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── 입장 화면 ── */
    #entrance {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      padding: 32px 24px;
      background: var(--bg);
    }

    #entrance h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 6px;
      text-align: center;
    }

    #entrance p {
      font-size: 14px;
      color: var(--ink-soft);
      margin-bottom: 40px;
      text-align: center;
      line-height: 1.5;
    }

    .nickname-card {
      width: 100%;
      background: var(--surface);
      box-shadow: var(--shadow);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .nickname-label {
      font-size: 12px;
      color: var(--ink-soft);
      margin-bottom: 8px;
      letter-spacing: 0.3px;
      width: 100%;
      text-align: center;
    }

    #nickname-display {
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.3;
      width: 100%;
      text-align: center;
    }

    .btn-reroll {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: none;
      border: 1.5px solid rgba(30, 30, 66, 0.18);
      border-radius: 100px;
      padding: 10px 20px;
      font-size: 14px;
      color: var(--ink-soft);
      cursor: pointer;
      margin: 0 auto 32px;
      font-family: inherit;
      transition: background 0.15s;
    }

    .btn-reroll:active { background: var(--bg-soft); }

    .btn-enter {
      width: 100%;
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
    }

    .btn-enter:active { opacity: 0.8; }

    /* ── 채팅 화면 ── */
    #chatroom {
      display: none;
      flex-direction: column;
      height: 100dvh;
      position: relative;
    }

    #chat-content {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      transition: filter 0.5s ease, opacity 0.5s ease;
    }

    /* 공용 popIn 패턴 (scale 0.4→1.05→1) — 안내 띠 등장에 사용 */
    @keyframes voteCardIn {
      0%   { opacity: 0; transform: scale(0.4); }
      60%  { opacity: 1; transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* ── 지금 진행 중인 질문 안내 ── 운영진 화면은 질문 중에도 채팅창 그대로(채팅 관리가 주목적), 질문은 헤더 아래 한 줄로만 */
    .mode-hint {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--bg-soft);
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      color: var(--ink-soft);
      flex-shrink: 0;
      min-width: 0;
    }
    .mode-hint.visible { display: flex; }
    .mode-hint-label {
      flex-shrink: 0;
      padding: 2px 8px;
      border-radius: 8px;
      background: var(--orange-tint);
      color: var(--orange-deep);
      font-size: 12px;
      font-weight: 700;
    }
    .mode-hint-text {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--ink);
      font-weight: 600;
    }
    .mode-hint-timer {
      flex-shrink: 0;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }

    #chat-header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    #chat-header .avatar {
      width: 32px;
      height: 32px;
      background: var(--ink);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #fff;
      font-weight: 700;
      flex-shrink: 0;
    }

    #chat-header .header-info {
      flex: 1;
      min-width: 0; /* 긴 닉네임이 헤더를 밀어내지 않게 */
    }

    #chat-header .header-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
    }

    #chat-header .header-sub {
      font-size: 12px;
      color: var(--ink-soft);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .msg-group {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .msg-bubble {
      display: inline-flex;
      flex-direction: column;
      background: var(--surface);
      color: var(--ink);
      align-self: flex-start; /* 글 길이에 맞춘 말풍선 (넓은 화면에서 가로로 늘어나지 않게) */
      padding: 8px 16px 10px;
      border-radius: 18px;
      box-shadow: 0 3px 12px rgba(30, 30, 66, 0.07);
      font-size: 15px;
      line-height: 1.4;
      max-width: 80%;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    /* 운영자 메시지 — 네이비 배경으로 구분 */
    .msg-bubble.operator { background: var(--ink); }
    .msg-bubble.operator .msg-nickname { color: rgba(255, 255, 255, 0.7); }
    .msg-bubble.operator .msg-text { color: #fff; }
    /* 운영진 전용: 각 메시지 삭제 버튼 */
    .host-del {
      flex-shrink: 0;
      padding: 8px 14px;
      border: none; border-radius: 10px;
      background: rgba(255, 59, 48, 0.12); color: var(--warn);
      font-size: 13px; font-weight: 700; line-height: 1;
      cursor: pointer;
    }
    .host-del:active { background: var(--warn); color: #fff; }

    .msg-nickname {
      font-size: 12px;
      font-weight: 700;
      color: var(--orange-deep); /* 닉네임 강조 — LED 화면과 같은 색 */
      margin-bottom: 2px;
    }

    .msg-text {
      color: var(--ink);
    }

    /* ── 입력창 ── */
    #input-area {
      background: var(--surface);
      border-top: 1px solid var(--line);
      padding: 8px 12px;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    #msg-input {
      flex: 1;
      min-width: 0; /* 좁은 화면에서 리액션/전송 버튼 밀림 방지 */
      background: var(--bg-soft);
      border: none;
      border-radius: 20px;
      padding: 9px 14px;
      font-size: 15px;
      font-family: inherit;
      color: var(--ink);
      outline: none;
      resize: none;
      max-height: 100px;
      line-height: 1.4;
    }

    #msg-input::placeholder { color: var(--ink-faint); }

    /* 리액션 버튼 (하트/붐업) */
    .react-btn {
      width: 34px;
      height: 34px;
      background: var(--bg-soft);
      border: none;
      border-radius: 50%;
      font-size: 17px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
    }

    .react-btn.pop { animation: reactPop 0.3s ease; }

    @keyframes reactPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.35); }
      100% { transform: scale(1); }
    }

    /* 글자 수 카운터: 80자 이상일 때만 표시 */
    #char-counter {
      display: none;
      font-size: 11px;
      color: var(--ink-soft);
      flex-shrink: 0;
      align-self: center;
    }

    #char-counter.visible { display: block; }
    #char-counter.limit { color: var(--warn); font-weight: 700; }

    /* ── 안내 띠 (연결 상태·전송 안내) ── 입력창 바로 위. 연결 끊김은 계속, 전송 안내는 잠깐 표시 */
    .notice-bar {
      display: none;
      margin: 0 12px 8px;
      padding: 8px 14px;
      border-radius: 14px;
      background: var(--ink);
      color: var(--surface);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      text-align: center;
      word-break: keep-all;
      overflow-wrap: break-word;
      flex-shrink: 0;
    }
    .notice-bar.visible {
      display: block;
      animation: voteCardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; /* 공용 popIn 패턴 */
    }
    .notice-bar.warn { background: var(--warn); }

    /* ── 운영진 공지 핀 ── 관리자가 운영진 채팅을 핀하면 채팅 맨 위에 고정 (관객 폰 chat.html과 같은 모양) */
    .pin-notice {
      display: none;
      align-items: flex-start;
      gap: 10px;
      margin: 8px 12px 0;
      padding: 10px 14px;
      border-radius: 14px;
      background: var(--ink);
      color: var(--surface);
      box-shadow: var(--shadow);
      flex-shrink: 0;
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    .pin-notice.visible {
      display: flex;
      animation: voteCardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; /* 공용 popIn 패턴 */
    }
    .pin-notice-icon { font-size: 16px; line-height: 1.4; flex-shrink: 0; }
    .pin-notice-body { flex: 1; min-width: 0; }
    .pin-notice-nick { font-size: 12px; font-weight: 700; color: rgba(255, 255, 255, 0.7); margin-bottom: 2px; }
    .pin-notice-text { font-size: 14px; font-weight: 700; line-height: 1.45; }

    /* ── 키 없음/틀림 안내 ── 입장·채팅 화면 어디서든 보이도록 상단 고정, 인증될 때까지 유지 */
    .auth-notice {
      display: none;
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 200;
      align-items: center;
      gap: 10px;
      padding: 10px 12px 10px 16px;
      border-radius: 14px;
      background: var(--warn);
      color: var(--surface);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      word-break: keep-all;
      overflow-wrap: break-word;
      box-shadow: 0 6px 18px rgba(30, 30, 66, 0.16);
    }
    .auth-notice.visible {
      display: flex;
      animation: voteCardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; /* 공용 popIn 패턴 */
    }
    .auth-notice span { flex: 1; min-width: 0; }
    .auth-notice button {
      flex-shrink: 0;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      background: var(--surface);
      color: var(--warn);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    #send-btn {
      width: 34px;
      height: 34px;
      background: var(--ink);
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }

    #send-btn:disabled { opacity: 0.3; cursor: default; }

    #send-btn svg { width: 16px; height: 16px; }
  </style>
</head>
<body>

<!-- 입장 화면 (운영자) -->
<div class="auth-notice" id="auth-notice" role="alert">
  <span>운영진 키가 필요합니다. 키를 넣기 전까지 운영자 표시·삭제가 되지 않습니다.</span>
  <button onclick="if (nickSocket) askStaffKey(nickSocket)">키 입력</button>
</div>

<div id="entrance">
  <h1>운영자 채팅</h1>
  <p>진행자·제작진용 채팅입니다.<br>화면에 표시될 이름을 입력하세요.</p>

  <div class="nickname-card">
    <div class="nickname-label">운영자 이름</div>
    <input id="operator-name" type="text" maxlength="20" placeholder="예: 진행자, MC, 운영진"
           style="width:100%; min-width:0; border:none; background:transparent; text-align:center;
                  font-size:20px; font-weight:700; color:var(--ink); outline:none;"
           onkeydown="if(event.key==='Enter')enterChat()">
  </div>

  <button class="btn-enter" onclick="enterChat()">이 이름으로 시작하기</button>
</div>

<!-- 채팅 화면 -->
<div id="chatroom">
  <div id="chat-content">
    <div id="chat-header">
      <div class="avatar" id="header-avatar">?</div>
      <div class="header-info">
        <div class="header-title" id="header-nickname"></div>
        <div class="header-sub">익명 토론 채팅</div>
      </div>
    </div>

    <!-- 질문 중일 때만: 지금 어떤 질문이 나가 있는지 한 줄 안내 (채팅창은 그대로) -->
    <div class="mode-hint" id="mode-hint" aria-live="polite">
      <span class="mode-hint-label" id="mode-hint-label"></span>
      <span class="mode-hint-text" id="mode-hint-text"></span>
      <span class="mode-hint-timer" id="mode-hint-timer"></span>
    </div>

    <!-- 운영진 공지 핀 (관리자가 운영진 채팅을 핀하면 표시) -->
    <div class="pin-notice" id="pin-notice" role="status">
      <span class="pin-notice-icon" aria-hidden="true">📢</span>
      <div class="pin-notice-body">
        <div class="pin-notice-nick" id="pin-notice-nick"></div>
        <div class="pin-notice-text" id="pin-notice-text"></div>
      </div>
    </div>

    <div id="messages"></div>

    <div class="notice-bar" id="notice-bar" role="status" aria-live="polite"></div>

    <div id="input-area">
      <button class="react-btn" id="react-heart" onclick="sendReaction('heart')">❤️</button>
      <button class="react-btn" id="react-thumbs" onclick="sendReaction('thumbs')">👍</button>
      <textarea id="msg-input" placeholder="메시지 입력..." rows="1" maxlength="100"></textarea>
      <span id="char-counter">0/100</span>
      <button id="send-btn" onclick="sendMessage()" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  // ── 테마 ──
  // 행사마다 닉네임 풀과 입장 문구가 다르다. 주소로 테마를 고른다.
  //   /          → office  (12월 본 공연: 직장인 썰루션 토크콘서트)
  //   /concert   → concert (공연장 현장 테스트용)
  // ?theme=xxx 로도 지정 가능. 서버(server.js)의 NICKNAME_THEMES와 풀이 동일해야
  // 닉네임이 중복돼 서버가 교체해줄 때도 같은 테마의 닉네임이 내려온다.
  const THEMES = {
    office: {
      title: '익명 채팅',
      heading: '오늘의 토론에 참여하세요',
      headerSub: '익명 토론 채팅',
      prefixes: [
        '야근하는', '퇴근못한', '커피없는', '월요일싫은', '점심기다리는',
        '회의중인', '보고서쓰는', '연차쓰고싶은', '상사눈치보는', '월급날기다리는',
        '카페인의존하는', '스트레스받는', '엑셀여는', '퇴사고민하는', '메신저피하는',
        '칼퇴원하는', '야식먹는', '재택원하는', '회식싫은', '마감쫓기는',
        '탕비실숨는', '화장실피신한', '창문바라보는', '점심혼밥하는', '복사실가는',
      ],
      suffixes: [
        '사원', '대리', '과장', '차장', '부장',
        '팀장', '인턴', '계약직', '신입', '3년차',
        '5년차', '10년차', '직장인', '사무직', '영업사원',
        '기획자', '디자이너', '개발자', '마케터', '경리',
        '총무', '프리랜서', '워커', '비서', '실장',
      ],
    },
    concert: {
      title: '공연 실시간 채팅',
      heading: '오늘 공연에 함께해주세요',
      headerSub: '실시간 익명 채팅',
      // 무료·공개 공연 기준. 티켓팅/굿즈/투어(첫공·막공·올콘)/응원봉·플카 같은
      // 유료 공연·아이돌 팬덤 전제 표현은 쓰지 않는다 (어떤 행사에서든 재사용 가능하도록).
      prefixes: [
        '소문듣고온', '앞자리사수한', '광대승천한', '앙코르기다리는', '목풀고온',
        '앞사람머리피하는', '친구따라온', '퇴근하고달려온', '지방에서온', '리허설부터온',
        '심장뛰는', '눈물참는', '소리지르는', '박수치는', '세트리스트외운',
        '오늘밤설레는', '두손모은', '무대만보는', '줄서서기다린', '숨죽인',
        '인트로부터운', '노래따라하는', '발끝세운', '조명바라보는', '한곡도못참는',
      ],
      suffixes: [
        '관객', '팬', '덕후', '직관러', '떼창러',
        '관람객', '리스너', '애청자', '1열관객', '2층관객',
        '뒷줄관객', '첫관람객', '감상러', '입장객', '박수러',
        '늦덕', '입덕러', '고인물', '뉴비', '단골',
        '동행인', '혼콘러', '최애러', '응원러', '목청러',
      ],
    },
  };

  // 주소로 테마 결정 (?theme= 우선, 없으면 경로)
  const themeKey = (() => {
    const q = new URLSearchParams(location.search).get('theme');
    if (q && THEMES[q]) return q;
    const path = location.pathname.replace(/\/+$/, '').split('/').pop();
    return THEMES[path] ? path : 'office';
  })();
  const theme = THEMES[themeKey];
  const PREFIXES = theme.prefixes;
  const SUFFIXES = theme.suffixes;


  let nicknamePool = [];
  let poolIndex = 0;

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function initNicknamePool() {
    const pool = [];
    for (const p of PREFIXES) {
      for (const s of SUFFIXES) {
        pool.push(`${p} ${s}`);
      }
    }
    nicknamePool = shuffle(pool);
    poolIndex = 0;
  }

  function getNewNickname() {
    if (nicknamePool.length === 0 || poolIndex >= nicknamePool.length) {
      initNicknamePool();
    }
    return nicknamePool[poolIndex++];
  }

  let currentNickname = '';
  let socket;
  let nickSocket;

  // ── 영구 클라이언트 ID (localStorage) — 투표 중복 방지 키 ──
  function getClientId() {
    let id = localStorage.getItem('ledClientId');
    if (!id) {
      id = 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
      localStorage.setItem('ledClientId', id);
    }
    return id;
  }
  const clientId = getClientId();

  // ── 제작진 인증 키 ── /host?key=비밀키 로 한 번 열면 이 브라우저에 기억된다(주소창에서는 지움).
  // 키가 없거나 틀리면 서버가 authError를 보내고, 여기서 키를 다시 물어본다.
  const STAFF_KEY_STORE = 'hostKey';
  function loadStaffKey() {
    const params = new URLSearchParams(location.search);
    const fromUrl = params.get('key');
    if (fromUrl) {
      try { localStorage.setItem(STAFF_KEY_STORE, fromUrl); } catch {}
      params.delete('key');
      const qs = params.toString();
      history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
      return fromUrl;
    }
    try { return localStorage.getItem(STAFF_KEY_STORE) || ''; } catch { return ''; }
  }
  let staffKey = loadStaffKey();
  function askStaffKey(sock) {
    const k = prompt('운영진 키가 필요합니다. 키를 입력해주세요.');
    if (!k) return; // 취소해도 상단 안내의 [키 입력]으로 다시 물을 수 있다
    staffKey = k.trim();
    try { localStorage.setItem(STAFF_KEY_STORE, staffKey); } catch {}
    sock.disconnect().connect(); // 새 키로 재접속 (auth는 접속할 때마다 staffKey를 읽음)
  }

  // 운영자 화면: 페이지 로드 시 소켓만 연결(닉네임은 입장 때 확정). 랜덤 닉네임/중복교체 없음.
  function requestNickname() {
    if (!nickSocket) {
      nickSocket = io({ auth: (cb) => cb({ key: staffKey, clientId }) });
      // 서버는 소켓당 authError를 1번만 보내므로, 인증될 때까지 상단 안내를 계속 띄워 둔다.
      // 접속 때 registerOperator → identify 순서로 보내므로, state가 올 때까지 authError가 없었으면 인증된 것이다.
      let authErrorSinceConnect = false;
      const setAuthNeeded = (need) => document.getElementById('auth-notice').classList.toggle('visible', need);
      nickSocket.on('authError', () => {
        authErrorSinceConnect = true;
        setAuthNeeded(true);
        askStaffKey(nickSocket);
      });
      nickSocket.on('state', () => { if (!authErrorSinceConnect) setAuthNeeded(false); });

      // 연결 상태 안내 — 끊기면 입력창 위에 계속 표시, 다시 연결되면 숨김
      nickSocket.on('disconnect', () => showNotice('연결이 끊겼어요. 다시 연결하는 중…', { sticky: true }));
      nickSocket.on('connect', hideNotice);
      nickSocket.on('connect', () => {
        authErrorSinceConnect = false;
        nickSocket.emit('registerOperator'); // 이 소켓의 채팅은 운영자로 표시 (키가 틀리면 여기서 authError)
        nickSocket.emit('identify', clientId);
      });
      // 이전 메시지 수신
      nickSocket.on('history', (messages) => {
        document.getElementById('messages').innerHTML = ''; // 재연결 시 중복 방지
        messages.forEach(addMessage);
        scrollToBottom();
      });
      // 새 메시지 수신
      nickSocket.on('chat', (msg) => {
        // 운영진이 위로 스크롤해 삭제하는 중이면 딸려 내려가지 않게, 맨 아래일 때만 따라감
        const box = document.getElementById('messages');
        const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
        addMessage(msg);
        if (atBottom) scrollToBottom();
      });
      // 채팅이 몰릴 때 서버가 묶어서 보내는 메시지
      nickSocket.on('chatBatch', (list) => {
        const box = document.getElementById('messages');
        const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
        list.forEach(addMessage);
        if (atBottom) scrollToBottom();
      });
      // 관리자가 채팅을 초기화하면 내 화면의 목록도 비운다
      nickSocket.on('chatCleared', () => {
        document.getElementById('messages').innerHTML = '';
      });
      // 관리자가 개별 채팅을 삭제하면 내 화면에서도 제거
      nickSocket.on('chatDeleted', (id) => {
        const el = document.querySelector('#messages [data-id="' + id + '"]');
        if (el) el.remove();
      });
      // 투표 상태 동기화는 입장 전에도 받아야 함 (연결 즉시 시작)
      nickSocket.on('state', applyVoteState);
      nickSocket.on('modeChange', applyVoteState);
      nickSocket.on('noticePinned', (data) => renderPinNotice(data && data.message));
    }
  }

  // 서버가 동시 중복을 감지해 새 닉네임을 내려주면 화면에 반영
  function applyReassignedNickname(name) {
    currentNickname = name;
    const display = document.getElementById('nickname-display');
    if (display) display.textContent = name;
    const headerNick = document.getElementById('header-nickname');
    if (headerNick) headerNick.textContent = name;
    const headerAvatar = document.getElementById('header-avatar');
    if (headerAvatar) headerAvatar.textContent = name.charAt(0);
  }

  // ══════════════════════════════════
  //  질문 안내 · 공지 핀 (운영진 화면)
  //  운영진 화면은 채팅 관리가 주목적이라 질문 중에도 채팅창을 가리지 않는다(투표·답변 카드 없음).
  //  지금 나가 있는 질문은 헤더 아래 한 줄로만 알려 준다. 운영자 채팅은 서버가 모든 모드에서 받는다.
  // ══════════════════════════════════
  let currentMode = 'chat';
  let hintTimerInterval = null;
  let hintEndTime = null;

  const MODE_HINTS = {
    voting: '투표 중',
    result: '투표 결과',
    subjective: '주관식 접수 중',
    subjectiveResult: '주관식 결과',
    emoji: '이모지 반응',
    applause: '함성 측정 중',
    applauseResult: '함성 결과',
  };

  function applyVoteState(state) {
    currentMode = state.mode;
    renderPinNotice(state.pinnedNotice);

    const hint = document.getElementById('mode-hint');
    const label = MODE_HINTS[state.mode];
    if (!label) { // 채팅·대기·엔딩 — 안내 없음
      hint.classList.remove('visible');
      stopHintTimer();
      return;
    }
    document.getElementById('mode-hint-label').textContent = label;
    let text = state.question || '';
    if (state.mode === 'applause') text = '관객 함성을 측정하고 있어요';
    else if (state.mode === 'applauseResult') text = `함성 지수 ${Math.round(((state.applause && state.applause.peak) || 0) * 100)}`;
    const textEl = document.getElementById('mode-hint-text');
    textEl.textContent = text;
    textEl.title = text; // 긴 질문은 말줄임 — 마우스를 올리면 전체
    hint.classList.add('visible');
    if (state.mode === 'voting' && state.votingEndTime) startHintTimer(state.votingEndTime);
    else stopHintTimer();
  }

  function startHintTimer(endTime) {
    hintEndTime = endTime;
    if (hintTimerInterval) clearInterval(hintTimerInterval);
    hintTimerInterval = setInterval(updateHintTimer, 250);
    updateHintTimer();
  }
  function stopHintTimer() {
    if (hintTimerInterval) clearInterval(hintTimerInterval);
    hintTimerInterval = null;
    document.getElementById('mode-hint-timer').textContent = '';
  }
  function updateHintTimer() {
    const remain = Math.max(0, Math.ceil((hintEndTime - Date.now()) / 1000));
    document.getElementById('mode-hint-timer').textContent = remain + '초';
  }

  // 운영진 공지 핀 — 관리자가 운영진 채팅을 핀하면 채팅 맨 위에 고정 (null이면 숨김)
  let pinNoticeKey = null;
  function renderPinNotice(msg) {
    const box = document.getElementById('pin-notice');
    const key = msg ? JSON.stringify([msg.id, msg.nickname, msg.text]) : null;
    if (key === pinNoticeKey) return; // 같은 공지 재전송이면 등장 애니메이션을 다시 틀지 않음
    pinNoticeKey = key;
    box.classList.remove('visible');
    if (!msg) return;
    document.getElementById('pin-notice-nick').textContent = msg.nickname || '';
    document.getElementById('pin-notice-text').textContent = msg.text || '';
    void box.offsetWidth; // 교체 때도 팝인 재시작
    box.classList.add('visible');
  }

  // ── 리액션 (하트/붐업/붐따) ──
  let lastReactionAt = 0;
  function sendReaction(type, btnEl) {
    const now = Date.now();
    if (now - lastReactionAt < 250) return; // 연타 제한
    lastReactionAt = now;
    if (!nickSocket || currentMode === 'voting' || currentMode === 'subjective') return;
    nickSocket.emit('reaction', { type });

    const btn = btnEl || document.getElementById(type === 'heart' ? 'react-heart' : 'react-thumbs');
    if (!btn) return;
    btn.classList.remove('pop');
    void btn.offsetWidth; // 애니메이션 재시작 트릭
    btn.classList.add('pop');
  }

  function enterChat() {
    // 운영자: 입력한 이름을 닉네임으로 확정
    const input = document.getElementById('operator-name');
    const name = (input ? input.value : '').trim().slice(0, 20);
    if (!name) { if (input) input.focus(); return; }
    currentNickname = name;

    // 닉네임 요청에 쓰던 소켓을 채팅에 재사용
    socket = nickSocket;

    // UI 전환
    document.getElementById('entrance').style.display = 'none';
    const chatroom = document.getElementById('chatroom');
    chatroom.style.display = 'flex';

    const initial = currentNickname.charAt(0);
    document.getElementById('header-avatar').textContent = initial;
    document.getElementById('header-nickname').textContent = currentNickname;
  }

  function addMessage(msg) {
    const messages = document.getElementById('messages');
    const group = document.createElement('div');
    group.className = 'msg-group';
    if (msg.id != null) group.dataset.id = msg.id;

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble' + (msg.isOperator ? ' operator' : '');

    const nick = document.createElement('div');
    nick.className = 'msg-nickname';
    nick.textContent = msg.nickname;

    const text = document.createElement('div');
    text.className = 'msg-text';
    text.textContent = msg.text;

    bubble.appendChild(nick);
    bubble.appendChild(text);
    group.appendChild(bubble);

    // 운영진: 부적절한 채팅을 직접 삭제 (모든 화면에서 사라짐)
    if (msg.id != null) {
      const del = document.createElement('button');
      del.className = 'host-del';
      del.textContent = '삭제';
      del.title = '이 채팅 삭제';
      del.onclick = () => {
        if (!confirm('이 채팅을 모든 화면에서 삭제할까요?\n\n' + msg.nickname + ': ' + msg.text)) return;
        nickSocket.emit('admin:deleteMessage', msg.id);
      };
      group.appendChild(del);
    }
    messages.appendChild(group);
  }

  function scrollToBottom() {
    const messages = document.getElementById('messages');
    messages.scrollTop = messages.scrollHeight;
  }

  // ── 안내 띠 ── 연결 끊김(sticky)은 다시 연결될 때까지 유지, 전송 안내는 3초 뒤 사라짐
  let noticeTimer = null;
  function showNotice(text, { warn = false, sticky = false } = {}) {
    const bar = document.getElementById('notice-bar');
    if (!sticky && bar.dataset.sticky === '1') return; // 연결 끊김 안내가 우선
    clearTimeout(noticeTimer);
    bar.textContent = text;
    bar.classList.toggle('warn', warn);
    bar.dataset.sticky = sticky ? '1' : '';
    bar.classList.remove('visible');
    void bar.offsetWidth; // 연속 표시 때 팝인 애니메이션 재시작
    bar.classList.add('visible');
    if (!sticky) noticeTimer = setTimeout(hideNotice, 3000);
  }
  function hideNotice() {
    const bar = document.getElementById('notice-bar');
    clearTimeout(noticeTimer);
    bar.classList.remove('visible');
    bar.dataset.sticky = '';
  }

  function sendMessage() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text || !socket) return;

    // 연결이 끊긴 동안엔 보내지 않고 입력 내용을 그대로 둔다(안내 띠가 이미 떠 있음)
    if (!socket.connected) {
      showNotice('연결이 끊겨 보내지 못했어요. 연결되면 다시 보내주세요.', { warn: true });
      return;
    }
    const sent = text.slice(0, 100);
    // 서버가 결과를 알려준다 — 거절되면 이유를 안내하고 보내려던 내용을 되살린다
    socket.timeout(5000).emit('chat', { nickname: currentNickname, text: sent }, (err, res) => {
      if (err) return showNotice('전송 확인이 늦어지고 있어요. 잠시만 기다려 주세요.');
      if (!res || res.ok || res.reason === 'empty') return;
      if (res.reason === 'rate') showNotice('너무 빨리 보내고 있어요. 잠시 후 다시 보내주세요.', { warn: true });
      else if (res.reason === 'mode') showNotice(currentMode === 'applause' || currentMode === 'applauseResult'
        ? '지금은 함성 측정 중이에요. 끝나면 다시 보내 주세요.'
        : '지금은 질문에 답하는 시간이라 채팅을 보낼 수 없어요.', { warn: true });
      if (!input.value) { // 그 사이 새로 입력하지 않았다면 되살리기
        input.value = sent;
        input.dispatchEvent(new Event('input'));
      }
    });
    input.value = '';
    input.style.height = 'auto';
    document.getElementById('send-btn').disabled = true;

    const counter = document.getElementById('char-counter');
    counter.classList.remove('visible', 'limit');
  }

  // 입력창 auto-resize + 전송 버튼 활성화
  document.addEventListener('DOMContentLoaded', () => {
    requestNickname(); // 페이지 로드 시 서버에서 첫 닉네임 배정

    const MAX_CHAT_LENGTH = 100;
    const input = document.getElementById('msg-input');
    const counter = document.getElementById('char-counter');
    input.addEventListener('input', () => {
      // maxlength 우회(붙여넣기 등) 대비 이중 방어
      if (input.value.length > MAX_CHAT_LENGTH) {
        input.value = input.value.slice(0, MAX_CHAT_LENGTH);
      }
      input.style.height = 'auto';
      input.style.height = input.scrollHeight + 'px';
      document.getElementById('send-btn').disabled = input.value.trim() === '';

      const len = input.value.length;
      counter.textContent = `${len}/${MAX_CHAT_LENGTH}`;
      counter.classList.toggle('visible', len >= 80);
      counter.classList.toggle('limit', len >= MAX_CHAT_LENGTH);
    });

    input.addEventListener('keydown', (e) => {
      if (e.isComposing) return;
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  });
</script>
</body>
</html>
