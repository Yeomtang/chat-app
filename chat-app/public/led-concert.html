<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LED 채팅 화면 (콘서트 4:3)</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/led-fx.css?v=20261109-audit"> <!-- LED 공용 모션 스타일 (led-fx.js와 짝). ?v=: 배포 때 캐시된 옛 파일을 쓰지 않도록 — 공용 파일을 고치면 두 LED 페이지의 v 값을 함께 올린다 -->
  <link rel="stylesheet" href="/led-page.css?v=20261109-audit"> <!-- LED 페이지 공용 스타일(세로형 값) — 가로형은 아래 <style>에서 다른 값만 덮어씀 -->
  <style>
    /* 가로형 전용 — 공용 LED 스타일(led-page.css, 세로형 값)에서 다른 값만 덮어쓴다 */
    :root {
      --fx-k: 1.3; /* 공용 모션(led-fx.css) 글자 배율 — 가로형은 질문·라벨이 세로형보다 큼 */
      /* --u: JS가 #screen 폭 ÷ 1040 으로 설정 */
    }

    /* 4:3 가로형 컨테이너 — 현장 LED 2496×1872 전용 (세로형의 좌우 여백 문제 해결) */
    #screen {
      width: min(100vw, calc(100vh * 4 / 3));
      height: min(100vh, calc(100vw * 3 / 4));
    }

    .led-msg-group {
      align-items: flex-start; /* 가로형: 말풍선을 내용 크기에 맞춤 (짧은 글은 작게, iMessage 스타일) */
    }

    .led-bubble {
      max-width: 62%; /* 가로형: 말풍선이 화면 폭 전체로 늘어나지 않도록 제한 */
    }

    .led-nickname { font-size: calc(14px * var(--u)); }
    .led-text { font-size: calc(22px * var(--u)); }

    .chat-pin-card {
      width: auto;           /* 세로형의 고정 폭(86%)을 되돌림 */
      max-width: 72%;        /* 일반적 길이 문장이 2줄로 감김 (짧으면 내용만큼만) */
      border-radius: calc(20px * var(--u));
      padding: calc(22px * var(--u)) calc(36px * var(--u));  /* 2줄을 담도록 세로 여유 */
    }

    .chat-pin-nick {
      font-size: calc(16px * var(--u));
      margin-bottom: calc(6px * var(--u));
    }

    .chat-pin-text {
      font-size: calc(30px * var(--u));
      line-height: 1.35;
    }

    #voting-timer {
      min-width: calc(100px * var(--u));
      height: calc(100px * var(--u));
      border-radius: calc(100px * var(--u));
      font-size: calc(40px * var(--u));
    }

    #voting-timer.done { font-size: calc(30px * var(--u)); }

    #voting-question { font-size: calc(38px * var(--u)); }

    #result-banner .result-line {
      padding: calc(12px * var(--u)) calc(28px * var(--u));
      font-size: calc(24px * var(--u));
    }
  </style>
</head>
<body>

<div id="screen">
  <div id="chat-layer">
    <div id="led-header">
      <div class="title">Live Chat</div>
    </div>

    <div id="led-messages"></div>

    <div id="led-footer">
      <div class="footer-bar">
        <div class="footer-dot"></div>
        <div class="footer-dot"></div>
        <div class="footer-dot"></div>
        <div class="footer-text">실시간 익명 채팅</div>
      </div>
      <div class="footer-send">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- 채팅 핀 팝업 (배경 반투명, 뒤에서 채팅은 계속 흐름) -->
  <div id="chat-pin"></div>


  <!-- 대기 화면 · 엔딩 "오늘의 결과" · 함성 미터 (모양·움직임은 LedFx.idle / ending / applause) -->
  <div id="idle-layer" class="fx-screen fx-idle fx-wide"></div>
  <div id="ending-layer" class="fx-screen fx-ending"></div>
  <div id="applause-layer" class="fx-screen fx-applause"></div>

  <!-- 리액션 레이어 (하트/붐업 이모지 떠오르는 효과) -->
  <div id="reaction-layer"></div>

  <!-- 투표 오버레이 -->
  <div id="voting-layer">
    <div id="voting-question-wrap">
      <div id="voting-question-card">
        <div id="voting-question"></div>
        <div id="voting-timer">30</div>
      </div>
    </div>
    <div id="voting-canvas-wrap">
      <canvas id="voting-canvas"></canvas>
      <!-- 객관식 3지 이상 결과: 막대 경주 (공 상자 자리에 겹쳐 표시) -->
      <div class="fx-bars" id="bar-race"></div>
    </div>
    <!-- 주관식: 답변 흘려보내기 -->
    <div id="answer-stream"></div>
    <!-- 주관식: 마감 후 워드클라우드 -->
    <div id="cloud-wrap"></div>
    <!-- 제작진 픽 → 스포트라이트 카드 -->
    <div id="spotlight"></div>
    <div id="result-banner">
      <div class="result-line" id="result-line">YES 00% · NO 00%</div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/vendor/qrcode.js?v=20261109-int"></script> <!-- 대기 화면 입장 QR (MIT, qrcode-generator) -->
<script src="/led-fx.js?v=20261109-audit"></script>
<script>
  // 가로형(4:3) 설정 — 동작(소켓·모드 전환·연출 배선)은 led-fx.js의 LedFx.page 공용
  LedFx.page.start({
    baseW: 1040, // 가로형 논리 기준폭 (세로형은 800). 작을수록 요소가 화면 대비 커짐
    box: { headerH: 48 },
    // 가로형(4:3): 4지까지는 한 줄 → 상자가 세로로 길어져 공이 쌓이고 비율이 읽힌다.
    // 5~6지는 한 줄이면 상자 폭이 120px까지 줄어 라벨을 읽을 수 없어 3열 2줄로.
    clusterLayout: (n) => (n <= 4 ? { cols: n, rows: 1 } : { cols: 3, rows: 2 }),
    // 보기 라벨: 2줄까지 줄바꿈 → 19px(세로형 800 기준 15px과 같은 비율)까지 축소 → 말줄임 (장평 압축 없음)
    boxLabel: { maxPx: () => 24, minPx: 19 },
    audiencePath: '/concert', // 대기 화면 QR = 콘서트 테마 관객 주소
    notice: false, // 운영진 공지 띠는 가로형 LED에 띄우지 않음 (세로형 LED·관객 폰·운영진 화면만)
  });
</script>
</body>
</html>
