<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LED 채팅 화면</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #ffffff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 2:3 비율 컨테이너 */
    #screen {
      width: min(100vw, calc(100vh * 2 / 3));
      height: min(100vh, calc(100vw * 3 / 2));
      background: #ffffff;
      position: relative;
      overflow: hidden;
    }

    /* 채팅 레이어 (블러 대상) */
    #chat-layer {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      transition: filter 0.5s ease, opacity 0.5s ease;
    }

    #chat-layer.blurred {
      filter: blur(16px);
      opacity: 0.5;
    }

    /* 상단 헤더 */
    #led-header {
      padding: 28px 28px 16px;
      flex-shrink: 0;
      border-bottom: 1px solid #f2f2f7;
    }

    #led-header .title {
      font-size: 13px;
      font-weight: 600;
      color: #8e8e93;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* 메시지 영역 */
    #led-messages {
      flex: 1;
      overflow: hidden;
      padding: 16px 28px 24px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 0;
      position: relative;
    }

    /* 상단 페이드 그라디언트 */
    #led-messages::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: linear-gradient(to bottom, #ffffff, transparent);
      z-index: 10;
      pointer-events: none;
    }

    .led-msg-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 12px;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .led-bubble {
      display: inline-flex;
      flex-direction: column;
      background: #f2f2f7;
      padding: 10px 16px 13px;
      border-radius: 20px;
      border-bottom-left-radius: 5px;
      max-width: 88%;
      word-break: break-word;
    }

    .led-nickname {
      font-size: 11px;
      font-weight: 600;
      color: #aeaeb2;
      margin-bottom: 3px;
      letter-spacing: 0.2px;
    }

    .led-text {
      font-size: 17px;
      font-weight: 400;
      color: #1c1c1e;
      line-height: 1.45;
    }

    /* 하단 입력 표시 영역 (장식용) */
    #led-footer {
      padding: 12px 28px 20px;
      border-top: 1px solid #f2f2f7;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .footer-bar {
      flex: 1;
      height: 38px;
      background: #f2f2f7;
      border-radius: 19px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 8px;
    }

    .footer-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #c7c7cc;
      animation: blink 1.4s infinite;
    }

    .footer-dot:nth-child(2) { animation-delay: 0.2s; }
    .footer-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }

    .footer-text {
      font-size: 13px;
      color: #c7c7cc;
    }

    .footer-send {
      width: 36px;
      height: 36px;
      background: #e9e9eb;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── 투표 오버레이 레이어 ── */
    #voting-layer {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      z-index: 20;
    }

    #voting-layer.active { display: flex; }

    #voting-question-wrap {
      padding: 40px 28px 0;
      text-align: center;
      flex-shrink: 0;
    }

    #voting-timer {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #1c1c1e;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    #voting-question {
      font-size: 22px;
      font-weight: 700;
      color: #1c1c1e;
      line-height: 1.4;
    }

    #voting-canvas-wrap {
      flex: 1;
      width: 100%;
      position: relative;
    }

    #voting-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #result-banner {
      display: none;
      padding: 0 28px 48px;
      text-align: center;
      flex-shrink: 0;
    }

    #result-banner.active { display: block; }

    #result-banner .result-line {
      font-size: 17px;
      color: #8e8e93;
      font-weight: 600;
    }

    #result-banner .result-pct {
      font-size: 15px;
      color: #1c1c1e;
      font-weight: 700;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div id="screen">
  <div id="chat-layer">
    <div id="led-header">
      <div class="title">Live Chat</div>
    </div>

    <div id="led-messages"></div>

    <div id="led-footer">
      <div class="footer-bar">
        <div class="footer-dot"></div>
        <div class="footer-dot"></div>
        <div class="footer-dot"></div>
        <div class="footer-text">실시간 익명 채팅</div>
      </div>
      <div class="footer-send">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#aeaeb2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- 투표 오버레이 -->
  <div id="voting-layer">
    <div id="voting-question-wrap">
      <div id="voting-timer">30</div>
      <div id="voting-question"></div>
    </div>
    <div id="voting-canvas-wrap">
      <canvas id="voting-canvas"></canvas>
    </div>
    <div id="result-banner">
      <div class="result-line" id="result-line">YES 00% · NO 00%</div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const MAX_VISIBLE = 8; // LED에 보여줄 최대 메시지 수
  const MAX_BUFFER = 300; // 일시정지 중에도 누적되는 메시지 버퍼 상한(메모리 보호용)
  const messages = [];
  let chatPaused = false; // 채팅 빈 영역 클릭으로 일시정지된 상태인지

  const container = document.getElementById('led-messages');
  const socket = io();

  socket.on('history', (history) => {
    const recent = history.slice(-MAX_VISIBLE);
    recent.forEach(addMessage);
  });

  socket.on('chat', (msg) => {
    addMessage(msg);
  });

  // 메시지 수신: 항상 버퍼(messages)에는 기록하되, 일시정지 중이면 화면엔 그리지 않음
  function addMessage(msg) {
    messages.push(msg);
    if (messages.length > MAX_BUFFER) messages.shift();
    if (chatPaused) return;
    renderMessage(msg);
  }

  function renderMessage(msg) {
    const group = document.createElement('div');
    group.className = 'led-msg-group';

    const bubble = document.createElement('div');
    bubble.className = 'led-bubble';

    const nick = document.createElement('div');
    nick.className = 'led-nickname';
    nick.textContent = msg.nickname;

    const text = document.createElement('div');
    text.className = 'led-text';
    text.textContent = msg.text;

    bubble.appendChild(nick);
    bubble.appendChild(text);
    group.appendChild(bubble);
    container.appendChild(group);

    // 최대 개수 초과 시 가장 오래된 것 제거
    const groups = container.querySelectorAll('.led-msg-group');
    if (groups.length > MAX_VISIBLE) {
      groups[0].remove();
    }
  }

  // 일시정지: 화면 갱신만 멈춤(버퍼링은 계속) — 더블클릭 시 최신 상태로 점프
  function pauseChat() {
    if (chatPaused) return;
    chatPaused = true;
  }

  function resumeChat() {
    if (!chatPaused) return;
    chatPaused = false;
    container.innerHTML = '';
    messages.slice(-MAX_VISIBLE).forEach(renderMessage);
  }

  // ══════════════════════════════════
  //  투표 모드
  // ══════════════════════════════════
  const chatLayer = document.getElementById('chat-layer');

  // 채팅 일시정지는 LED 화면 클릭이 아니라 관리자 화면(admin.html)에서 제어한다.
  // 서버가 보내는 'chatPauseChange'/state.chatPaused 값을 그대로 따른다.

  const votingLayer = document.getElementById('voting-layer');
  const votingQuestion = document.getElementById('voting-question');
  const votingTimer = document.getElementById('voting-timer');
  const resultBanner = document.getElementById('result-banner');
  const resultLine = document.getElementById('result-line');

  const canvas = document.getElementById('voting-canvas');
  const ctx = canvas.getContext('2d');

  const COLOR_YES = '#34c759';
  const COLOR_NO = '#ff3b30';
  const BALL_SCALE = 1.5; // 공/레이블 크기 배율

  // ── 단계별(merge) 공 크기 ──
  // ones: 1표 = 작은 공, tens: 10표 모이면 한 단계 큰 공, hundreds: 100표 모이면 더 큰 공
  const TIER_SCALE = 1.8; // 단계마다 반지름 배율
  const BALL_R = {
    ones: 7 * BALL_SCALE,
    tens: 7 * BALL_SCALE * TIER_SCALE,
    hundreds: 7 * BALL_SCALE * TIER_SCALE * TIER_SCALE,
  };
  const POP_DURATION = 450; // 새 단계 공 등장 시 팝 애니메이션(ms)

  // side('yes'|'no') -> { ones: [...], tens: [...], hundreds: [...] }
  // 각 슬롯: { x, y, tx, ty, phase, bornAt }
  let tierState = {
    yes: { ones: [], tens: [], hundreds: [] },
    no: { ones: [], tens: [], hundreds: [] },
  };

  let votingEndTime = null;
  let timerInterval = null;
  let rafHandle = null;
  let currentMode = 'chat';

  function resizeCanvas() {
    const wrap = document.getElementById('voting-canvas-wrap');
    const rect = wrap.getBoundingClientRect();
    canvas.width = rect.width * devicePixelRatio;
    canvas.height = rect.height * devicePixelRatio;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
  }
  window.addEventListener('resize', resizeCanvas);

  function clusterCenter(side) {
    const w = canvas.width / devicePixelRatio;
    const h = canvas.height / devicePixelRatio;
    return side === 'yes'
      ? { x: w * 0.27, y: h * 0.5 }
      : { x: w * 0.73, y: h * 0.5 };
  }

  function easeOutBack(t) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  // 한 단계(ones/tens/hundreds)의 공들을 sunflower 패킹으로 배치.
  // innerOffset: 더 안쪽 단계가 차지한 반지름만큼 바깥으로 밀어주는 값 (단계끼리 안 겹치게)
  function packTier(centerX, centerY, angleOffset, count, radius, innerOffset) {
    if (count <= 0) return { positions: [], outerExtent: innerOffset };
    const golden = Math.PI * (3 - Math.sqrt(5));
    const packRadius = innerOffset + radius * 1.15 * Math.sqrt(count);
    const positions = [];
    for (let i = 0; i < count; i++) {
      const rr = count === 1 ? innerOffset : innerOffset + (packRadius - innerOffset) * Math.sqrt((i + 0.5) / count);
      const theta = i * golden + angleOffset;
      positions.push({ x: centerX + rr * Math.cos(theta), y: centerY + rr * Math.sin(theta) });
    }
    return { positions, outerExtent: packRadius + radius };
  }

  // 클러스터 내 위치 재배치: hundreds(안쪽) → tens(중간) → ones(바깥쪽) 순서로 동심원 배치
  function repackSide(side) {
    const slots = tierState[side];
    const center = clusterCenter(side);

    const hundredsPack = packTier(center.x, center.y, 0, slots.hundreds.length, BALL_R.hundreds, 0);
    hundredsPack.positions.forEach((pos, i) => { slots.hundreds[i].tx = pos.x; slots.hundreds[i].ty = pos.y; });

    const tensPack = packTier(center.x, center.y, 1.3, slots.tens.length, BALL_R.tens, hundredsPack.outerExtent + 4);
    tensPack.positions.forEach((pos, i) => { slots.tens[i].tx = pos.x; slots.tens[i].ty = pos.y; });

    const onesPack = packTier(center.x, center.y, 2.6, slots.ones.length, BALL_R.ones, tensPack.outerExtent + 4);
    onesPack.positions.forEach((pos, i) => { slots.ones[i].tx = pos.x; slots.ones[i].ty = pos.y; });
  }

  // 표 개수(total)에 맞춰 ones/tens/hundreds 슬롯 배열 길이를 조정
  function syncTierArray(side, tierName, desiredCount) {
    const arr = tierState[side][tierName];
    const center = clusterCenter(side);
    while (arr.length < desiredCount) {
      arr.push({ x: center.x, y: center.y, tx: center.x, ty: center.y, phase: Math.random() * Math.PI * 2, bornAt: performance.now() });
    }
    while (arr.length > desiredCount) {
      arr.pop();
    }
  }

  function applyCounts(side, total) {
    const n = total || 0;
    const hundreds = Math.floor(n / 100);
    const tens = Math.floor((n % 100) / 10);
    const ones = n % 10;
    syncTierArray(side, 'hundreds', hundreds);
    syncTierArray(side, 'tens', tens);
    syncTierArray(side, 'ones', ones);
    repackSide(side);
  }

  function drawTier(slots, radius, color, time) {
    slots.forEach((p) => {
      p.x += (p.tx - p.x) * 0.12;
      p.y += (p.ty - p.y) * 0.12;
      const age = performance.now() - p.bornAt;
      const t = Math.min(1, age / POP_DURATION);
      const scale = Math.max(0, t >= 1 ? 1 : easeOutBack(t));
      const jitterX = Math.sin(time / 600 + p.phase) * 2;
      const jitterY = Math.cos(time / 700 + p.phase) * 2;

      ctx.beginPath();
      ctx.arc(p.x + jitterX, p.y + jitterY, radius * scale, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.85;
      ctx.fill();
      ctx.globalAlpha = 1;
    });
  }

  function drawFrame(time) {
    ctx.save();
    ctx.scale(devicePixelRatio, devicePixelRatio);
    const w = canvas.width / devicePixelRatio;
    const h = canvas.height / devicePixelRatio;
    ctx.clearRect(0, 0, w, h);

    // 클러스터 레이블
    const yc = clusterCenter('yes');
    const nc = clusterCenter('no');
    ctx.font = `700 ${Math.round(15 * BALL_SCALE)}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = COLOR_YES;
    ctx.fillText('YES', yc.x, h * 0.5 - 110 * BALL_SCALE);
    ctx.fillStyle = COLOR_NO;
    ctx.fillText('NO', nc.x, h * 0.5 - 110 * BALL_SCALE);

    ['yes', 'no'].forEach((side) => {
      const color = side === 'yes' ? COLOR_YES : COLOR_NO;
      drawTier(tierState[side].ones, BALL_R.ones, color, time);
      drawTier(tierState[side].tens, BALL_R.tens, color, time);
      drawTier(tierState[side].hundreds, BALL_R.hundreds, color, time);
    });

    ctx.restore();
    rafHandle = requestAnimationFrame(drawFrame);
  }

  function startRenderLoop() {
    if (rafHandle) cancelAnimationFrame(rafHandle);
    resizeCanvas();
    rafHandle = requestAnimationFrame(drawFrame);
  }

  function stopRenderLoop() {
    if (rafHandle) cancelAnimationFrame(rafHandle);
    rafHandle = null;
  }

  function updateTimerDisplay() {
    if (!votingEndTime) return;
    const remain = Math.max(0, Math.ceil((votingEndTime - Date.now()) / 1000));
    votingTimer.textContent = remain;
  }

  function updateResultLine(counts) {
    const c = counts || { yes: 0, no: 0, total: 0 };
    const yesPct = c.total ? Math.round((c.yes / c.total) * 100) : 0;
    const noPct = c.total ? 100 - yesPct : 0;
    resultLine.textContent = `YES ${yesPct}%  ·  NO ${noPct}%`;
  }

  function applyState(state) {
    currentMode = state.mode;

    // 채팅 일시정지 상태는 모드와 별개로 항상 서버 값을 따른다(관리자 화면에서 제어)
    if (state.chatPaused) pauseChat(); else resumeChat();

    if (state.mode === 'chat') {
      chatLayer.classList.remove('blurred');
      votingLayer.classList.remove('active');
      resultBanner.classList.remove('active');
      stopRenderLoop();
      if (timerInterval) clearInterval(timerInterval);
      return;
    }

    // voting 또는 result
    chatLayer.classList.add('blurred');
    votingLayer.classList.add('active');
    votingQuestion.textContent = state.question || '';
    applyCounts('yes', state.counts ? state.counts.yes : 0);
    applyCounts('no', state.counts ? state.counts.no : 0);
    startRenderLoop();

    if (state.mode === 'voting') {
      // 투표 중엔 숫자 배너 없이 공 클러스터 이동만으로 실시간 현황을 보여줌
      resultBanner.classList.remove('active');
      votingTimer.style.display = 'inline-flex';
      votingQuestion.style.display = 'block';
      votingEndTime = state.votingEndTime;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(updateTimerDisplay, 200);
      updateTimerDisplay();
    } else if (state.mode === 'result') {
      // 타이머만 숨기고, 질문은 상단에 유지해 무엇에 대한 결과인지 상기시킴
      if (timerInterval) clearInterval(timerInterval);
      votingTimer.style.display = 'none';
      votingQuestion.style.display = 'block';
      updateResultLine(state.counts);
      resultBanner.classList.add('active');
    }
  }

  socket.on('state', applyState);
  socket.on('modeChange', applyState);

  socket.on('voteUpdate', (data) => {
    if (currentMode !== 'voting') return;
    const c = data.counts || { yes: 0, no: 0 };
    applyCounts('yes', c.yes);
    applyCounts('no', c.no);
  });

  // 관리자 화면에서 채팅 정지/재생을 누르면 서버가 모든 화면에 broadcast
  socket.on('chatPauseChange', (data) => {
    if (data && data.chatPaused) pauseChat(); else resumeChat();
  });

  socket.emit('identify', 'led-screen-' + Math.random().toString(36).slice(2));
</script>
</body>
</html>
