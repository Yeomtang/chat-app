<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LED 채팅 화면</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/led-fx.css?v=20261109-audit"> <!-- LED 공용 모션 스타일 (led-fx.js와 짝). ?v=: 배포 때 캐시된 옛 파일을 쓰지 않도록 — 공용 파일을 고치면 두 LED 페이지의 v 값을 함께 올린다 -->
  <link rel="stylesheet" href="/led-page.css?v=20261109-audit"> <!-- LED 페이지 공용 스타일(세로형 값) -->
</head>
<body>

<div id="screen">
  <div id="chat-layer">
    <div id="led-header">
      <div class="title">Live Chat</div>
    </div>

    <!-- 운영진 공지 핀 (관리자가 운영진 채팅을 핀하면 헤더 바로 아래 띠, LedFx.notice) — 채팅 영역을 덮지 않고 밀어 내린다 -->
    <div id="notice-pin" class="fx-notice fx-notice-flow" role="status"></div>

    <div id="led-messages"></div>

    <div id="led-footer">
      <div class="footer-bar">
        <div class="footer-dot"></div>
        <div class="footer-dot"></div>
        <div class="footer-dot"></div>
        <div class="footer-text">실시간 익명 채팅</div>
      </div>
      <div class="footer-send">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- 채팅 핀 팝업 (배경 반투명, 뒤에서 채팅은 계속 흐름) -->
  <div id="chat-pin"></div>

  <!-- 대기 화면 · 엔딩 "오늘의 결과" · 함성 미터 (모양·움직임은 LedFx.idle / ending / applause) -->
  <div id="idle-layer" class="fx-screen fx-idle"></div>
  <div id="ending-layer" class="fx-screen fx-ending"></div>
  <div id="applause-layer" class="fx-screen fx-applause"></div>

  <!-- 리액션 레이어 (하트/붐업 이모지 떠오르는 효과) -->
  <div id="reaction-layer"></div>

  <!-- 투표 오버레이 -->
  <div id="voting-layer">
    <div id="voting-question-wrap">
      <div id="voting-question-card">
        <div id="voting-question"></div>
        <div id="voting-timer">30</div>
      </div>
    </div>
    <div id="voting-canvas-wrap">
      <canvas id="voting-canvas"></canvas>
      <!-- 객관식 3지 이상 결과: 막대 경주 (공 상자 자리에 겹쳐 표시) -->
      <div class="fx-bars" id="bar-race"></div>
    </div>
    <!-- 주관식: 답변 흘려보내기 -->
    <div id="answer-stream"></div>
    <!-- 주관식: 마감 후 워드클라우드 -->
    <div id="cloud-wrap"></div>
    <!-- 제작진 픽 → 스포트라이트 카드 -->
    <div id="spotlight"></div>
    <div id="result-banner">
      <div class="result-line" id="result-line">YES 00% · NO 00%</div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/vendor/qrcode.js?v=20261109-int"></script> <!-- 대기 화면 입장 QR (MIT, qrcode-generator) -->
<script src="/led-fx.js?v=20261109-audit"></script>
<script>
  // 세로형(2:3) 설정 — 동작(소켓·모드 전환·연출 배선)은 led-fx.js의 LedFx.page 공용
  LedFx.page.start({
    baseW: 800, // 설계 기준 폭 (화면 배율 --u = 실제 폭 / 800)
    box: { headerH: 46 },
    // 보기 상자 격자: 2지=좌우, 3지=가로 3, 4지 이상은 2줄 (4지=2×2 …)
    clusterLayout(n) {
      const cols = n <= 3 ? n : Math.ceil(n / 2);
      const rows = Math.ceil(n / cols);
      return { cols, rows };
    },
    // 보기 라벨: 2줄까지 줄바꿈 → 15px까지 축소 → 말줄임 (장평 압축 없음). 5~6지도 18px에서 시작
    boxLabel: { maxPx: (n) => (n <= 2 ? 21 : n <= 4 ? 19 : 18), minPx: 15 },
    audiencePath: '/', // 대기 화면 QR = 세로형 관객 주소
  });
</script>
</body>
</html>
