<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LED 채팅 화면</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/led-fx.css?v=20261109-staff"> <!-- LED 공용 모션 스타일 (led-fx.js와 짝). ?v=: 배포 때 캐시된 옛 파일을 쓰지 않도록 — 공용 파일을 고치면 두 LED 페이지의 v 값을 함께 올린다 -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── 디자인 토큰 (블러시 팔레트) ──
       시안 기준: 블러시 배경 위에 흰 카드, 오렌지/인디고 포인트, 네이비 잉크 */
    :root {
      --u: 1; /* 화면 배율 — JS가 #screen 폭 ÷ 800 으로 설정 (해상도 무관 동일 비율) */
      --bg:          #efdcd5; /* 화면 배경 (블러시) */
      --bg-soft:     #f8ece7; /* 입력창 등 보조 표면 */
      --surface:     #ffffff; /* 카드 · 말풍선 */
      --ink:         #1e1e42; /* 본문 텍스트 · 네이비 */
      --ink-soft:    #6e6a86; /* 보조 텍스트 */
      --ink-faint:   #a49eb4; /* 흐린 텍스트 · 플레이스홀더 */
      --orange:      #fb7e55; /* 1번 보기 · 강조 */
      --orange-tint: #ffe6db;
      --orange-deep: #b5502e;
      --purple:      #5b5cc4; /* 2번 보기 */
      --purple-tint: #e3e3f7;
      --warn:        #d94f3d;
      --line:        rgba(30, 30, 66, 0.10);
      --shadow:      0 calc(8px * var(--u)) calc(24px * var(--u)) rgba(30, 30, 66, 0.08);
      --shadow-lg:   0 calc(18px * var(--u)) calc(50px * var(--u)) rgba(30, 30, 66, 0.16);
    }

    body {
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 2:3 비율 컨테이너 */
    #screen {
      width: min(100vw, calc(100vh * 2 / 3));
      height: min(100vh, calc(100vw * 3 / 2));
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }

    /* 채팅 레이어 (블러 대상) */
    #chat-layer {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      transition: filter 0.5s ease, opacity 0.5s ease, transform 0.5s ease;
    }

    /* 질문 모드 진입 시: 블러 + 살짝 뒤로 물러나는 깊이감 (복귀 시 역재생) */
    #chat-layer.blurred {
      filter: blur(calc(16px * var(--u)));
      opacity: 0.5;
      transform: scale(0.94);
    }

    /* 상단 헤더 */
    #led-header {
      padding: calc(28px * var(--u)) calc(28px * var(--u)) calc(16px * var(--u));
      flex-shrink: 0;
      border-bottom: calc(1px * var(--u)) solid var(--line);
    }

    #led-header .title {
      font-size: calc(13px * var(--u));
      font-weight: 600;
      color: var(--ink-soft);
      letter-spacing: calc(1px * var(--u));
      text-transform: uppercase;
    }

    /* 메시지 영역 */
    #led-messages {
      flex: 1;
      overflow: hidden;
      padding: calc(16px * var(--u)) calc(28px * var(--u)) calc(24px * var(--u));
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 0;
      position: relative;
    }

    /* 상단 페이드 그라디언트 */
    #led-messages::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: calc(80px * var(--u));
      background: linear-gradient(to bottom, var(--bg), transparent);
      z-index: 10;
      pointer-events: none;
    }

    .led-msg-group {
      display: flex;
      flex-direction: column;
      margin-bottom: calc(12px * var(--u));
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(calc(20px * var(--u)));
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .led-bubble {
      display: inline-flex;
      flex-direction: column;
      background: var(--surface);
      padding: calc(10px * var(--u)) calc(16px * var(--u)) calc(13px * var(--u));
      border-radius: calc(20px * var(--u)); /* 네 모서리 균일 — 관객 화면 말풍선과 같은 모양 */
      box-shadow: 0 calc(4px * var(--u)) calc(14px * var(--u)) rgba(30, 30, 66, 0.07);
      /* 말풍선 오른쪽 끝을 하단 입력 바와 같은 라인에 맞춤 (양쪽 모두 좌우 calc(28px * var(--u)) 패딩) */
      max-width: 100%;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    /* 운영자(진행자·제작진) 메시지 — 네이비 배경으로 관객과 구분 */
    .led-bubble.operator { background: var(--ink); }
    .led-bubble.operator .led-nickname { color: rgba(255, 255, 255, 0.7); }
    .led-bubble.operator .led-text { color: #fff; }

    .led-nickname {
      font-size: calc(11px * var(--u));
      font-weight: 700;
      color: var(--orange-deep); /* 닉네임 강조 — 관객 화면과 같은 색 */
      margin-bottom: calc(3px * var(--u));
      letter-spacing: calc(0.2px * var(--u));
    }

    .led-text {
      font-size: calc(17px * var(--u));
      font-weight: 400;
      color: var(--ink);
      line-height: 1.45;
    }

    /* 하단 입력 표시 영역 (장식용) */
    #led-footer {
      padding: calc(12px * var(--u)) calc(28px * var(--u)) calc(20px * var(--u));
      border-top: calc(1px * var(--u)) solid var(--line);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: calc(10px * var(--u));
    }

    .footer-bar {
      flex: 1;
      height: calc(38px * var(--u));
      background: var(--surface);
      border-radius: calc(19px * var(--u));
      display: flex;
      align-items: center;
      padding: 0 calc(14px * var(--u));
      gap: calc(8px * var(--u));
    }

    .footer-dot {
      width: calc(5px * var(--u));
      height: calc(5px * var(--u));
      border-radius: 50%;
      background: var(--ink-faint);
      animation: blink 1.4s infinite;
    }

    .footer-dot:nth-child(2) { animation-delay: 0.2s; }
    .footer-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }

    .footer-text {
      font-size: calc(13px * var(--u));
      color: var(--ink-faint);
    }

    .footer-send {
      width: calc(36px * var(--u));
      height: calc(36px * var(--u));
      background: var(--bg-soft);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── 채팅 핀 (카드는 핀마다 새로 만든다 — 교체 시 이전 카드가 위로 빠지는 동안 둘이 함께 보임, LedFx.pin) ── */
    #chat-pin {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 0 calc(32px * var(--u));
      z-index: 15; /* 채팅 위, 투표(20)/리액션(25) 아래 */
      --fx-cover: 62%; /* 배경 가림막(.fx-lift-cover) 반투명 비율 — 뒤에서 채팅이 계속 흐르는 게 보임 */
      pointer-events: none;
    }

    #chat-pin.active { display: flex; }

    .chat-pin-card {
      position: relative; /* 배경 가림막(.fx-lift-cover) 위에 */
      width: 86%;            /* 글자 수와 무관하게 채팅 폭 수준으로 고정 */
      background: var(--orange); /* 강조 말풍선 — 일반 흰 말풍선과 구분 */
      border-radius: calc(16px * var(--u));
      padding: calc(8px * var(--u)) calc(30px * var(--u));     /* 세로를 더 얇게 — 길쭉한 슬림 바 */
      box-shadow: 0 calc(14px * var(--u)) calc(40px * var(--u)) rgba(0, 0, 0, 0.18);
      text-align: center;    /* 닉네임·본문 가운데 정렬 */
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    /* 말풍선이 채팅 화면에 보이지 않을 때(일시정지·스크롤 밖·재접속)만 팝인 — 보이면 말풍선이 카드로 떠오름 */
    .chat-pin-card.pop {
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .chat-pin-nick {
      font-size: calc(12px * var(--u));
      font-weight: 700;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: calc(2px * var(--u));
    }

    .chat-pin-text {
      font-size: calc(20px * var(--u));
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
      text-wrap: balance; /* 여러 줄을 길이가 고르게 분배 — 읽기 좋은 줄바꿈 (미지원 시 자연 폴백) */
    }

    /* ── 리액션 레이어 ── */
    #reaction-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 25; /* 채팅/투표 레이어 위에 항상 표시 */
      overflow: hidden;
    }

    .reaction-float {
      position: absolute;
      will-change: transform, opacity;
      filter: drop-shadow(0 calc(2px * var(--u)) calc(6px * var(--u)) rgba(0, 0, 0, 0.15));
    }

    /* 하트 폭발·어절 등장·막대 경주 등 공용 모션 클래스는 led-fx.css */

    /* 동작 줄이기: 장식 모션 생략 (내용은 그대로 보임) */
    @media (prefers-reduced-motion: reduce) {
      #voting-timer.hot { animation: none; }
    }

    /* ── 투표 오버레이 레이어 ── */
    #voting-layer {
      position: absolute;
      inset: 0;
      display: none;
      z-index: 20;
    }

    #voting-layer.active { display: block; }

    /* 질문: 공 클러스터 위쪽 가까이 배치 (화면 최상단 X) */
    #voting-question-wrap {
      position: absolute;
      top: 15%;
      left: 0;
      right: 0;
      padding: 0 calc(28px * var(--u));
      text-align: center;
      z-index: 2;
      opacity: 0;
      transform: scale(0.4);
    }

    /* 질문+타이머 등장: 관객 폰 투표 카드와 동일한 팝인 바운스
       (voting→result 동안 레이어가 유지되면 재생 안 되고, 다음 질문에서만 다시 재생) */
    #voting-layer.active #voting-question-wrap {
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes popIn {
      0%   { opacity: 0; transform: scale(0.4); }
      60%  { opacity: 1; transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* 질문 카드: 흰 카드 위쪽 중앙에 네이비 배지가 걸쳐진 형태 */
    #voting-question-card {
      position: relative;
      display: inline-block;
      max-width: 100%;
      background: var(--surface);
      border-radius: calc(18px * var(--u));
      padding: calc(26px * var(--u)) calc(30px * var(--u)) calc(22px * var(--u));
      box-shadow: var(--shadow);
    }

    #voting-timer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(-50%, -50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: calc(56px * var(--u));
      height: calc(56px * var(--u));
      border-radius: 50%;
      background: var(--ink);
      color: #fff;
      font-size: calc(20px * var(--u));
      font-weight: 700;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* 마지막 5초: 경고색 + 1초 맥박 (LedFx.timer가 .hot 토글).
       transform이 위치 잡기(translate)에 쓰이므로 맥박 키프레임에도 함께 적는다 */
    #voting-timer.hot {
      background: var(--warn);
      color: var(--surface);
      animation: timerPulse 1s ease-in-out infinite;
    }

    @keyframes timerPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50%      { transform: translate(-50%, -50%) scale(1.12); }
    }

    #voting-question {
      font-size: calc(22px * var(--u));
      font-weight: 700;
      color: var(--ink);
      line-height: 1.4;
      word-break: keep-all;      /* 한글 어절 단위 줄바꿈 */
      overflow-wrap: break-word; /* 한 어절이 너무 길면 예외적으로 자름 */
    }

    /* 공 상자·막대 영역: 위 끝은 JS가 질문 카드 실제 아래 끝에 맞춤(layoutBelowQuestion), 아래는 화면 여백만.
       2지선다 결과 배너는 상자 바로 아래에 JS가 붙임 (아래 22%를 통째로 비워 두지 않음) */
    #voting-canvas-wrap {
      position: absolute;
      top: 22%;
      bottom: 3%;
      left: 0;
      right: 0;
    }

    #voting-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── 주관식: 답변 흘려보내기 ── */
    #answer-stream {
      display: none;
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    #answer-stream.active { display: block; }

    .answer-float {
      position: absolute;
      white-space: nowrap;
      background: var(--surface);
      color: var(--ink);
      font-weight: 600;
      padding: calc(12px * var(--u)) calc(22px * var(--u));
      border-radius: calc(100px * var(--u));
      will-change: transform;
      box-shadow: 0 calc(2px * var(--u)) calc(10px * var(--u)) rgba(0, 0, 0, 0.06);
    }

    /* ── 주관식: 워드클라우드 ── */
    #cloud-wrap {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: 24%;   /* JS가 질문 카드 아래 끝에 맞춤 */
      bottom: 5%; /* 아래 여백만 — 단어는 이 영역에 맞춰 크기가 줄어듦 (LedFx.cloud) */
      align-items: center;
      justify-content: center;
      padding: 0 calc(36px * var(--u));
      z-index: 1;
    }

    #cloud-wrap.active {
      display: flex;
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* 단어·도착·둥실 스타일은 led-fx.css (.fx-cloud*) */

    .cloud-empty {
      font-size: calc(17px * var(--u));
      color: var(--ink-soft);
      font-weight: 600;
    }

    /* ── 제작진 픽 스포트라이트 ── */
    #spotlight {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 0 calc(36px * var(--u));
      z-index: 3; /* 흘려보내기/워드클라우드 위, 리액션(25) 아래 */
      pointer-events: none;
    }

    #spotlight.active { display: flex; }

    /* 카드는 픽마다 새로 만든다 (교체 시 이전 카드가 위로 빠지는 동안 둘이 함께 보임) */
    .spotlight-card {
      position: relative; /* 배경 가림막(.fx-lift-cover) 위에 */
      max-width: 86%;
      background: var(--ink);
      color: #fff;
      font-size: calc(30px * var(--u));
      font-weight: 700; /* 800은 한글 폰트 가짜 굵기 문제 */
      line-height: 1.35;
      text-align: center;
      padding: calc(28px * var(--u)) calc(36px * var(--u));
      border-radius: calc(24px * var(--u));
      box-shadow: 0 calc(20px * var(--u)) calc(60px * var(--u)) rgba(0, 0, 0, 0.25);
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    /* 픽한 답변이 화면에 흐르고 있지 않을 때만 팝인 (흐르던 답변은 카드로 늘어남 — LedFx.spotlight) */
    .spotlight-card.pop {
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* 결과 퍼센트: 공 클러스터 아래쪽 가까이 배치 (화면 최하단 X) */
    #result-banner {
      display: none;
      position: absolute;
      bottom: 11%;
      left: 0;
      right: 0;
      padding: 0 calc(28px * var(--u));
      text-align: center;
      z-index: 2;
    }

    #result-banner.active {
      display: block;
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    #result-banner .result-line {
      display: inline-block;
      background: var(--surface);
      border-radius: calc(100px * var(--u));
      padding: calc(10px * var(--u)) calc(22px * var(--u));
      box-shadow: var(--shadow);
      font-size: calc(17px * var(--u));
      color: var(--ink);
      font-weight: 700;
    }

    #result-banner .result-pct {
      font-size: calc(15px * var(--u));
      color: var(--ink);
      font-weight: 700;
      margin-top: calc(4px * var(--u));
    }
  </style>
</head>
<body>

<div id="screen">
  <div id="chat-layer">
    <div id="led-header">
      <div class="title">Live Chat</div>
    </div>

    <div id="led-messages"></div>

    <div id="led-footer">
      <div class="footer-bar">
        <div class="footer-dot"></div>
        <div class="footer-dot"></div>
        <div class="footer-dot"></div>
        <div class="footer-text">실시간 익명 채팅</div>
      </div>
      <div class="footer-send">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a49eb4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- 채팅 핀 팝업 (배경 반투명, 뒤에서 채팅은 계속 흐름) -->
  <div id="chat-pin"></div>

  <!-- 운영진 공지 핀 (관리자가 운영진 채팅을 핀하면 맨 위 띠, LedFx.notice) -->
  <div id="notice-pin" class="fx-notice" role="status"></div>

  <!-- 대기 화면 · 엔딩 "오늘의 결과" · 함성 미터 (모양·움직임은 LedFx.idle / ending / applause) -->
  <div id="idle-layer" class="fx-screen fx-idle"></div>
  <div id="ending-layer" class="fx-screen fx-ending"></div>
  <div id="applause-layer" class="fx-screen fx-applause"></div>

  <!-- 리액션 레이어 (하트/붐업 이모지 떠오르는 효과) -->
  <div id="reaction-layer"></div>
